name: Trip Reminders


on:
  schedule:
    - cron: '0 0 * * *'→ Runs at 00:00  # UTC midnight = 8 AM SGT
  workflow_dispatch: # Allow manual trigger


jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: holiday-tracker


      - name: Check upcoming events and send reminders
        uses: actions/github-script@v7
        env:
          REMINDER_EMAIL: ${{ secrets.REMINDER_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');


            // Extract trip data from importTrips() function
            const match = html.match(/function importTrips\(\)\{return\[([\s\S]*?)\];\}/);
            if (!match) { console.log('No trip data found'); return; }


            // Parse dates
            const today = new Date();
            today.setHours(0,0,0,0);
            const todayStr = today.toISOString().slice(0,10);
            const tomorrow = new Date(today.getTime() + 86400000);
            const tomorrowStr = tomorrow.toISOString().slice(0,10);
            const in7days = new Date(today.getTime() + 7*86400000);
