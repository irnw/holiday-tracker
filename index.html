const SU_LABELS={airline:'Airline',flightNumber:'Flight #',pnr:'PNR',seat:'Seat',from:'From',to:'To',date:'Date',dateTo:'End Date',departureTime:'Departure',arrivalTime:'Arrival',duration:'Duration',hotelName:'Hotel',name:'Name',bookingNumber:'Booking #',cost:'Cost',currency:'Currency',locations:'Locations'};
function suFieldHtml(k,v){
  const label=SU_LABELS[k]||k.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase());
  const val=Array.isArray(v)?v.join(', '):String(v||'');
  const cls=val?'detected':'empty';
  return `<div class="su-field"><span class="k">${label}</span><span class="v ${cls}">${val?esc(val):'Not detected'}</span></div>`;
}
function suParsedHtml(parsed){
  let h='<h4><span style="color:var(--green)">✓</span> Extracted Data</h4>';
  if(parsed.multiLeg&&parsed.legs){
    h+=suFieldHtml('Type','Multi-segment flight ('+parsed.legs.length+' legs)');
    h+=suFieldHtml('pnr',parsed.pnr);h+=suFieldHtml('airline',parsed.airline);
    h+=suFieldHtml('date',(parsed.date||'')+' → '+(parsed.dateTo||parsed.date||''));
    parsed.legs.forEach((leg,i)=>{
      h+=`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><span style="font-weight:600;font-size:11px;color:var(--primary)">Leg ${i+1}: ${esc(leg.flightNumber||'')}</span></div>`;
      h+=suFieldHtml('Route',(leg.from||'?')+' → '+(leg.to||'?'));
      if(leg.date)h+=suFieldHtml('date',leg.date);
      if(leg.departureTime)h+=suFieldHtml('departureTime',leg.departureTime);
      if(leg.arrivalTime)h+=suFieldHtml('arrivalTime',leg.arrivalTime);
      if(leg.seat)h+=suFieldHtml('seat',leg.seat);
      if(leg.duration)h+=suFieldHtml('duration',leg.duration);
    });
  }else{
    const order=['airline','flightNumber','hotelName','name','from','to','date','dateTo','departureTime','arrivalTime','pnr','seat','duration','bookingNumber','cost','currency','locations'];
    const shown=new Set();
    order.forEach(k=>{if(parsed[k]){h+=suFieldHtml(k,parsed[k]);shown.add(k);}});
    Object.entries(parsed).filter(([k,v])=>v&&!shown.has(k)&&k!=='rawText'&&k!=='type'&&k!=='multiLeg'&&k!=='legs').forEach(([k,v])=>{h+=suFieldHtml(k,v);});
  }
  if(parsed.rawText)h+=`<button class="su-raw-toggle" onclick="const el=this.nextElementSibling;el.style.display=el.style.display==='none'?'block':'none';this.textContent=el.style.display==='none'?'Show raw text ▸':'Hide raw text ▾'">Show raw text ▸</button><div class="ocr-out" style="display:none;margin-top:4px">${esc(parsed.rawText)}</div>`;
  return h;
}

        S.events.push(ev);

  });
  // Hook into OCR completion to parse

      const evSel=document.getElementById('su-event');
      if(parsed.date){

        let bestMatch=null,bestDist=Infinity;
        for(const tr of S.events){
          const ts=new Date(tr.startDate+'T00:00:00').getTime(),te=new Date(tr.endDate+'T00:00:00').getTime();
          const buf=3*864e5;// 3 day buffer
          if(pd>=(ts-buf)&&pd<=(te+buf)){

  inp.onchange=e=>{if(e.target.files.length)hookOCR(e.target.files[0]);};

        const buf=3*864e5;
        if(pd>=(ts-buf)&&pd<=(te+buf)){
          const dist=Math.min(Math.abs(pd-ts),Math.abs(pd-te));
          if(dist<bestDist){bestDist=dist;bestMatch=tr;}
        }
      }
      if(!bestMatch&&parsed.locations&&parsed.locations.length){
        bestMatch=S.events.find(tr=>tr.locations.some(l=>parsed.locations.some(pl=>l.toUpperCase().includes(pl.toUpperCase())||pl.toUpperCase().includes(l.toUpperCase()))));

      if(bestMatch)evSel.value=bestMatch.id;

function parseDate(str,yearHint){
  const curYear=yearHint||new Date().getFullYear();
  let m;
  // "26 May 2026" / "11 SEP 2026"
  if((m=str.match(/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+(\d{4})/i)))
    return `${m[3]}-${MMAP[m[2].toLowerCase().slice(0,3)]}-${m[1].padStart(2,'0')}`;
  // "Mon, 25 May" / "FRIDAY 11 SEP"
  if((m=str.match(/(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\w*[,.]?\s*(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/i))){
    const mm=MMAP[m[2].toLowerCase().slice(0,3)];
    let yr=curYear;const td2=new Date(yr,parseInt(mm)-1,parseInt(m[1]));if(td2<new Date(Date.now()-90*864e5))yr++;
    return `${yr}-${mm}-${m[1].padStart(2,'0')}`;
  }
  // "27 Aug" / "01 Sep" / "27 Aug (Thu)" — day-first without year (common in intl bookings)
  if((m=str.match(/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)(?:\w*)?(?:\s*\(\w+\))?/i))&&!str.match(/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+\d{4}/i)){
    const mm=MMAP[m[2].toLowerCase().slice(0,3)];
    let yr=curYear;const td2=new Date(yr,parseInt(mm)-1,parseInt(m[1]));if(td2<new Date(Date.now()-90*864e5))yr++;
    return `${yr}-${mm}-${m[1].padStart(2,'0')}`;
  }
  // "May 26" / "Sep 23"
  if((m=str.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*[,.]?\s*(\d{1,2})/i))){
    const mm=MMAP[m[1].toLowerCase().slice(0,3)];
    let yr=curYear;const td2=new Date(yr,parseInt(mm)-1,parseInt(m[2]));if(td2<new Date(Date.now()-90*864e5))yr++;
    return `${yr}-${mm}-${m[2].padStart(2,'0')}`;
  }
  // "2026-09-11"
  if((m=str.match(/(\d{4})-(\d{2})-(\d{2})/)))return m[0];
  return null;
}

function findAirports(str){
  const t=str.toUpperCase(),found=[];
  for(const[code,city]of Object.entries(AIRPORTS)){
    const re=new RegExp('\\b'+code+'\\b','g');let m;
    while((m=re.exec(t))!==null)found.push({code,city,pos:m.index});
  }
  return found.sort((a,b)=>a.pos-b.pos);
}

// ===== MULTI-SEGMENT FLIGHT PARSER =====
function _splitPositions(txt,pat){
  const positions=[];let m;
  while((m=pat.exec(txt))!==null)positions.push(m.index);
  return positions;
}
function _segmentsFromPositions(txt,positions){
  const segments=[];
  for(let i=0;i<positions.length;i++){
    const start=positions[i];
    const end=i+1<positions.length?positions[i+1]:txt.length;
    segments.push(txt.substring(start,end));
  }
  return segments;
}
const _FNCODES=Object.keys(AIRLINE_MAP).map(c=>c.replace(/([.*+?^${}()|[\]\\])/g,'\\$1')).join('|');
// Word-boundary airline name matching (prevents "MANAGE" matching "ANA" etc.)
function _matchAirlineName(text){
  const t=text.toUpperCase();
  for(const al of AIRLINE_NAMES){
    const esc=al.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
    if(new RegExp('\\b'+esc+'\\b').test(t))return al;
  }
  return '';
}
function _tryDirectExtract(txt){
  const routeLinePat=new RegExp('\\b('+_FNCODES+')\\s*(\\d{3,5})\\s+([A-Z]{3})\\s*[-–—]\\s*([A-Z]{3})\\b','g');
  const routeLines=[];let rlm;
  while((rlm=routeLinePat.exec(txt))!==null){
    const fn=(rlm[1]+rlm[2]).replace(/\s/g,'');
    if(AIRPORTS[rlm[3]]&&AIRPORTS[rlm[4]]&&!routeLines.some(r2=>r2.fn===fn)){
      const lineEnd=txt.indexOf('\n',rlm.index);
      const lineText=txt.substring(rlm.index,lineEnd>0?lineEnd:rlm.index+200);
      routeLines.push({fn,code:rlm[1],from:rlm[3],to:rlm[4],pos:rlm.index,lineText});
    }
  }
  if(routeLines.length<2)return null;
  let pnr2='';
  const pnrM2=txt.match(/(?:PNR|RESERVATION\s*CODE|Booking\s*(?:Ref(?:erence)?|No\.?|Number|ID|Code)|Confirmation\s*(?:Number|Code|#))\s*[:#]?\s*([A-Z0-9]{4,10})/i);
  if(pnrM2)pnr2=pnrM2[1];
  const ga=_matchAirlineName(txt);
  const yrM2=txt.match(/\b(20[2-3]\d)\b/);
  const yh=yrM2?parseInt(yrM2[1]):new Date().getFullYear();
  const directLegs=[];
  for(const rl of routeLines){
    const leg={};
    leg.flightNumber=rl.fn;
    leg.from=AIRPORTS[rl.from];leg.fromCode=rl.from;
    leg.to=AIRPORTS[rl.to];leg.toCode=rl.to;
    leg.airline=AIRLINE_MAP[rl.code]||ga;
    leg.pnr=pnr2;
    const seatM=rl.lineText.match(/\b(\d{1,3}[A-HJ-K])\b/);
    if(seatM)leg.seat=seatM[1];
    const bagM=rl.lineText.match(/(\d+)\s*kg/i);
    if(bagM)leg.baggage=bagM[1]+'kg';
    const depTimeAll=[];const arrTimeAll=[];
    const depRe=new RegExp('\\b'+rl.from+'\\s+(\\d{1,2}:\\d{2})','g');
    let dtm;while((dtm=depRe.exec(txt))!==null)depTimeAll.push(dtm[1]);
    const arrRe=new RegExp('\\b'+rl.to+'\\s+(\\d{1,2}:\\d{2})','g');
    while((dtm=arrRe.exec(txt))!==null)arrTimeAll.push(dtm[1]);
    const legIdx=directLegs.length;
    if(depTimeAll.length>legIdx)leg.departureTime=depTimeAll[legIdx];
    else if(depTimeAll.length>0)leg.departureTime=depTimeAll[0];
    if(arrTimeAll.length>legIdx)leg.arrivalTime=arrTimeAll[legIdx];
    else if(arrTimeAll.length>0)leg.arrivalTime=arrTimeAll[0];
    const datePatAll=[];
    const dpRe=/(\d{1,2})\s+(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\b/gi;
    let dpm;while((dpm=dpRe.exec(txt))!==null){const pd=parseDate(dpm[0],yh);if(pd)datePatAll.push(pd);}
    const uniqueDates=[...new Set(datePatAll)].sort();
    if(uniqueDates.length>0){
      if(legIdx===0)leg.date=uniqueDates[0];
      else if(uniqueDates.length>1){
        const laterDates=uniqueDates.filter(d=>d>directLegs[0].date);
        leg.date=laterDates.length>0?laterDates[0]:uniqueDates[uniqueDates.length-1];
      }else leg.date=uniqueDates[0];
    }
    if(leg.arrivalTime&&leg.departureTime&&leg.date){
      const depH=parseInt(leg.departureTime);const arrH=parseInt(leg.arrivalTime);
      if(arrH<depH){const laterDates=uniqueDates.filter(d=>d>leg.date);if(laterDates.length>0)leg.arrivalDate=laterDates[0];}
    }
    const durPats=[/(\d+)\s*h(?:(?:ou)?rs?)?\s*(\d+)\s*m(?:in)?s?/gi];
    for(const dp2 of durPats){
      const durAll=[];let dum;
      while((dum=dp2.exec(txt))!==null)durAll.push(dum[1]+'h '+dum[2]+'m');
      if(durAll.length>legIdx)leg.duration=durAll[legIdx];
      else if(durAll.length>0&&legIdx>0)leg.duration=durAll[durAll.length-1];
      else if(durAll.length>0)leg.duration=durAll[0];
    }
    leg.name=`${leg.airline||''} ${leg.flightNumber}`.trim()+` (${leg.fromCode} → ${leg.toCode})`;
    directLegs.push(leg);
  }
  return directLegs.length>=2?directLegs:null;
}
function parseFlightSegments(txt){
  const t=txt.toUpperCase();
  let segments=null;let _strat='none';

  // Strategy 1: "DEPARTURE:" markers (Ethiopian, some OTAs)
  const depPos=_splitPositions(txt,/DEPARTURE\s*:\s*/gi);
  if(depPos.length>=2){segments=_segmentsFromPositions(txt,depPos);_strat='1-departure';}

  // Strategy 2: "Outbound"/"Return"/"Inbound" headers
  if(!segments){
    const orbPos=_splitPositions(txt,/(?:^|\n)\s*(?:OUTBOUND|RETURN|INBOUND|ONWARD|GOING|COMING\s+BACK)\s*(?:FLIGHT|JOURNEY|TRIP)?\s*[:\-]?\s*/gim);
    if(orbPos.length>=2){segments=_segmentsFromPositions(txt,orbPos);_strat='2-outbound';}
  }

  // Strategy 3: "Flight 1"/"Flight 2" or "Segment 1"/"Segment 2" or "Leg 1" headers
  if(!segments){
    const fltNumPos=_splitPositions(txt,/(?:^|\n)\s*(?:Flight|Segment|Leg|Sector)\s+(\d+)\s*[:\-]?\s*/gim);
    if(fltNumPos.length>=2){segments=_segmentsFromPositions(txt,fltNumPos);_strat='3-flightN';}
  }

  // Strategy 3b: Numbered route headers "1. Singapore to Melbourne" / "2. Melbourne to Singapore"
  if(!segments){
    const numRoutePos=_splitPositions(txt,/(?:^|\n)\s*\d+\.\s+\w[\w\s]*?\s+to\s+\w[\w\s]*?(?:\s*[-–—]\s*|$|\n)/gim);
    if(numRoutePos.length>=2){segments=_segmentsFromPositions(txt,numRoutePos);_strat='3b-numRoute';}
  }

  // Strategy 4: Multiple distinct flight numbers — split around each
  if(!segments){
    const fnPat=new RegExp('\\b('+_FNCODES+')\\s*(\\d{3,5})\\b','g');
    const fnMatches=[];let fm;const seenFn=new Set();
    while((fm=fnPat.exec(txt))!==null){
      const fn=(fm[1]+fm[2]).replace(/\s/g,'');
      if(!seenFn.has(fn)){seenFn.add(fn);fnMatches.push({fn,pos:fm.index});}
    }
    if(fnMatches.length>=2){
      // Split at each flight number position, using some context before (up to 200 chars back to nearest newline)
      const positions=fnMatches.map(f=>{
        let start=f.pos;
        const lookback=txt.substring(Math.max(0,start-200),start);
        const nlIdx=lookback.lastIndexOf('\n');
        if(nlIdx>=0)start=f.pos-200+nlIdx+1<0?0:f.pos-(lookback.length-nlIdx-1);
        return Math.max(0,start);
      });
      // Deduplicate positions that are too close (within 20 chars)
      const dedupPos=[positions[0]];
      for(let i=1;i<positions.length;i++){if(positions[i]-dedupPos[dedupPos.length-1]>20)dedupPos.push(positions[i]);}
      if(dedupPos.length>=2){segments=_segmentsFromPositions(txt,dedupPos);_strat='4-flightNums';}
    }
  }

  // Strategy 5: Multiple route arrows "SIN → KUL" / "SIN - KUL" with airport codes
  if(!segments){
    const routePat=/\b([A-Z]{3})\s*(?:→|->|–|—|to)\s*([A-Z]{3})\b/g;
    const routeMatches=[];let rm;
    while((rm=routePat.exec(txt))!==null){
      if(AIRPORTS[rm[1]]&&AIRPORTS[rm[2]])routeMatches.push({pos:rm.index,from:rm[1],to:rm[2]});
    }
    if(routeMatches.length>=2){
      const positions=routeMatches.map(r=>{
        let start=r.pos;
        const lookback=txt.substring(Math.max(0,start-200),start);
        const nlIdx=lookback.lastIndexOf('\n');
        if(nlIdx>=0)start=r.pos-(lookback.length-nlIdx-1);
        return Math.max(0,start);
      });
      const dedupPos=[positions[0]];
      for(let i=1;i<positions.length;i++){if(positions[i]-dedupPos[dedupPos.length-1]>20)dedupPos.push(positions[i]);}
      if(dedupPos.length>=2){segments=_segmentsFromPositions(txt,dedupPos);_strat='5-routeArrows';}
    }
  }

  // Strategy 6: Multiple airport code pairs (4+ distinct codes suggesting 2+ routes)
  if(!segments){
    const allAps=findAirports(txt);
    const distinctAps=[];
    for(const a of allAps){if(!distinctAps.length||distinctAps[distinctAps.length-1].code!==a.code)distinctAps.push(a);}
    // 4+ distinct codes = at least 2 flights (e.g. SIN-KUL, KUL-SIN)
    if(distinctAps.length>=4){
      // Group into pairs and split between them
      const pairPositions=[];
      for(let i=0;i<distinctAps.length-1;i+=2){
        let start=distinctAps[i].pos;
        const lookback=txt.substring(Math.max(0,start-150),start);
        const nlIdx=lookback.lastIndexOf('\n');
        if(nlIdx>=0)start=distinctAps[i].pos-(lookback.length-nlIdx-1);
        pairPositions.push(Math.max(0,start));
      }
      if(pairPositions.length>=2){segments=_segmentsFromPositions(txt,pairPositions);_strat='6-airportPairs';}
    }
  }

  console.log('parseFlightSegments: strategy='+_strat+', segments='+(segments?segments.length:'null'));

  // Strategy 7: Direct extraction from "SQ 237 SIN - MEL" patterns (passenger/seat section)
  // Now extracted to _tryDirectExtract() so it can also be used as final fallback
  if(!segments||segments.length<2){
    const direct=_tryDirectExtract(txt);
    if(direct)return direct;
    return null;
  }

  // Parse each segment into a flight leg
  const legs=[];
  let pnr='';
  const pnrM=txt.match(/(?:PNR|RESERVATION\s*CODE|Booking\s*(?:Ref(?:erence)?|No\.?|Number|ID|Code)|Confirmation\s*(?:Number|Code|#))\s*[:#]?\s*([A-Z0-9]{4,10})/i);
  if(pnrM)pnr=pnrM[1];
  let globalAirline=_matchAirlineName(txt);
  const yrM=txt.match(/\b(20[2-3]\d)\b/);
  const yearHint=yrM?parseInt(yrM[1]):new Date().getFullYear();

  for(const seg of segments){
    const leg={};
    const su=seg.toUpperCase();
    leg.pnr=pnr;
    leg.airline=globalAirline;
    const segTop=seg.substring(0,Math.min(seg.length,250));
    const segAl=_matchAirlineName(segTop);if(segAl)leg.airline=segAl;
    const fnPats=[
      new RegExp('\\b('+_FNCODES+')\\s*(\\d{3,5})\\b'),
      /(?:Flight|Flt)\s*(?:No\.?|#)?\s*[:#]?\s*([A-Z0-9]{2}\s*\d{2,5})/i,
    ];
    for(const pat of fnPats){const m=seg.match(pat);if(m){
      leg.flightNumber=m[2]?(m[1]+m[2]).replace(/\s/g,''):m[1].replace(/\s/g,'');
      if(m[1]&&AIRLINE_MAP[m[1]])leg.airline=AIRLINE_MAP[m[1]];
      break;
    }}
    const aps=findAirports(seg);
    const distinctAps=[];
    for(const a of aps){if(!distinctAps.length||distinctAps[distinctAps.length-1].code!==a.code)distinctAps.push(a);}
    if(distinctAps.length>=1){leg.from=distinctAps[0].city;leg.fromCode=distinctAps[0].code;}
    if(distinctAps.length>=2){leg.to=distinctAps[1].city;leg.toCode=distinctAps[1].code;}
    const segDate=parseDate(seg,yearHint);
    if(segDate)leg.date=segDate;
    const arrDateM=seg.match(/ARRIVAL\s*:\s*(.*?)(?:\n|Please)/i);
    if(arrDateM){const ad=parseDate(arrDateM[1],yearHint);if(ad)leg.arrivalDate=ad;}
    // Try to find a second distinct date for arrival (overnight flights: "27 Aug" depart, "28 Aug" arrive)
    if(!leg.arrivalDate&&leg.date){
      const datePatterns=[
        /(\d{1,2})\s+(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\b/gi
      ];
      for(const dp of datePatterns){
        const allDates=[];let dm;
        while((dm=dp.exec(seg))!==null)allDates.push({txt:dm[0],pos:dm.index});
        if(allDates.length>=2){
          const secondDate=parseDate(allDates[allDates.length-1].txt,yearHint);
          if(secondDate&&secondDate!==leg.date)leg.arrivalDate=secondDate;
        }
      }
    }
    // Times: try structured patterns first, then generic
    const depTimeM=seg.match(/(?:Depart(?:ing|ure)?\s*(?:At|Time)?\s*[:#]?\s*|DEPARTING\s*\n?\s*)(\d{1,2}:\d{2}\s*(?:am|pm)?)/i);
    const arrTimeM=seg.match(/(?:Arriv(?:al|ing)\s*(?:At|Time)?\s*[:#]?\s*|ARRIVING\s*\n?\s*)(\d{1,2}:\d{2}\s*(?:am|pm)?)/i);
    if(depTimeM)leg.departureTime=depTimeM[1].trim();
    if(arrTimeM)leg.arrivalTime=arrTimeM[1].trim();
    // Airport-code-prefixed times: "DPS 12:10"
    if(!leg.departureTime&&leg.fromCode){const acM=seg.match(new RegExp(leg.fromCode+'\\s+(\\d{1,2}:\\d{2})'));if(acM)leg.departureTime=acM[1];}
    if(!leg.arrivalTime&&leg.toCode){const acM=seg.match(new RegExp(leg.toCode+'\\s+(\\d{1,2}:\\d{2})'));if(acM)leg.arrivalTime=acM[1];}
    if(!leg.departureTime||!leg.arrivalTime){
      const times=[];const seenT2=new Set();let tm;
      const tp2=/\b(\d{1,2}:\d{2}\s*(?:am|pm)?)\b/gi;
      while((tm=tp2.exec(seg))!==null){const v=tm[1].trim();if(!seenT2.has(v)){times.push(v);seenT2.add(v);}}
      if(!leg.departureTime&&times.length>=1)leg.departureTime=times[0];
      if(!leg.arrivalTime&&times.length>=2)leg.arrivalTime=times[1];
    }
    const seatM=seg.match(/(?:Seats?)\s*:\s*[\s\S]*?(\d{1,3}[A-HJ-K])\b/i);
    if(seatM)leg.seat=seatM[1];
    const durM=seg.match(/(?:Duration|Flight\s*Time|(?:Total\s+)?(?:travel|flying)\s*time)\s*[:#]?\s*(\d+)\s*h(?:(?:ou)?rs?)?\s*(\d+)\s*m(?:in)?s?/i);
    if(durM)leg.duration=durM[1]+'h '+durM[2]+'m';
    else{const durM2=seg.match(/(\d+)h(?:rs?)?\s*(\d+)\s*m(?:in)?s?/i);if(durM2)leg.duration=durM2[1]+'h '+durM2[2]+'m';}
    const cabM=seg.match(/Cabin\s*:\s*([A-Za-z\s\/]+?)(?:\s{2,}|\n|Status)/i);
    if(cabM)leg.cabin=cabM[1].trim().slice(0,30);
    // Fallback seat: look in full text for "SQ 237 SIN - MEL 61H" pattern
    if(!leg.seat&&leg.flightNumber){
      const fnEsc=leg.flightNumber.replace(/(\d)/,'\\s*$1');
      const seatFromFull=txt.match(new RegExp(fnEsc+'[^\\n]*?(\\d{1,3}[A-HJ-K])\\b','i'));
      if(seatFromFull)leg.seat=seatFromFull[1];
    }
    // Fallback baggage
    if(!leg.baggage&&leg.flightNumber){
      const fnEsc=leg.flightNumber.replace(/(\d)/,'\\s*$1');
      const bagM=txt.match(new RegExp(fnEsc+'[^\\n]*?(\\d+)\\s*kg','i'));
      if(bagM)leg.baggage=bagM[1]+'kg';
    }
    leg.name=`${leg.airline||''} ${leg.flightNumber||''}`.trim()+(leg.from&&leg.to?` (${leg.fromCode||leg.from} → ${leg.toCode||leg.to})`:'');
    if(leg.flightNumber||leg.from)legs.push(leg);
  }
  console.log('parseFlightSegments: segment parsing produced '+legs.length+' legs');
  if(legs.length>=2)return legs;
  // Final fallback: Strategy 7 direct extraction (passenger section patterns)
  // Runs here when earlier strategies found segments but per-segment parsing failed
  console.log('parseFlightSegments: falling back to direct extraction (Strategy 7)');
  return _tryDirectExtract(txt);
}

function dedupeLines(txt){
  // Some PDF extractors (e.g. Malaysia Airlines) repeat each line 2-4x
  const lines=txt.split('\n');const out=[];
  for(let i=0;i<lines.length;i++){
    const l=lines[i].trim();
    if(!l){out.push('');continue;}
    // Skip if same as previous non-empty line
    if(out.length&&out[out.length-1].trim()===l)continue;
    out.push(lines[i]);
  }
  return out.join('\n');
}

function parseBookingText(rawTxt){
  const txt=dedupeLines(rawTxt);
  const r={};const t=txt.toUpperCase();

  // ===== 0. Try multi-segment flight parsing first =====
  const multiLegs=parseFlightSegments(txt);
  if(multiLegs){
    r.type='flight';r.multiLeg=true;r.legs=multiLegs;r.pnr=multiLegs[0].pnr||'';
    const alCount={};multiLegs.forEach(l=>{if(l.airline)alCount[l.airline]=(alCount[l.airline]||0)+1;});
    r.airline=Object.entries(alCount).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';
    const allDates=multiLegs.map(l=>l.date).filter(Boolean).sort();
    if(allDates.length)r.date=allDates[0];
    if(allDates.length>1)r.dateTo=allDates[allDates.length-1];
    const arrDates=multiLegs.map(l=>l.arrivalDate).filter(Boolean);
    if(arrDates.length){const latest=[...allDates,...arrDates].sort();r.dateTo=latest[latest.length-1];}
    const locSet=new Set();
    multiLegs.forEach(l=>{if(l.from)locSet.add(l.from);if(l.to)locSet.add(l.to);});
    r.locations=[...locSet];r.from=multiLegs[0].from||'';r.to=multiLegs[multiLegs.length-1].to||'';
    // Set top-level fields from first leg so single-form filling works as fallback
    r.flightNumber=multiLegs[0].flightNumber||'';
    r.departureTime=multiLegs[0].departureTime||'';
    r.arrivalTime=multiLegs[0].arrivalTime||'';
    r.seat=multiLegs[0].seat||'';
    r.duration=multiLegs[0].duration||'';
    r.name=`${r.airline} ${r.from} → ${r.to} (${multiLegs.length} legs)`;
    return r;
  }

  // ===== 1. Detect booking type (hotel-first to prevent CHECK-IN false positives) =====
  const hotelKw=/\b(BOOKING\.COM|AGODA|EXPEDIA|HOTELS\.COM|HOSTELWORLD|AIRBNB|VRBO)\b/i.test(txt)||
    /\b(HOTEL|RESORT|HOSTEL|VILLA|INN|GUESTHOUSE|BUNGALOW|HOMESTAY|LODGE|APARTMENT|ACCOMMODATION)\b/i.test(txt)||
    (/\bcheck.?in\b/i.test(txt)&&/\bcheck.?out\b/i.test(txt)&&/\b\d+\s*nights?\b/i.test(txt))||
    /\byour\s+booking\s+in\b/i.test(txt)||/\bexpecting\s+you\b/i.test(txt);
  const flightKw=/\b(FLIGHT|BOARDING\s*PASS|E-?TICKET|ITINERARY\s*(?:RECEIPT)?|AIRLINE|GATE\s*\d|TERMINAL\s*\d|BAGGAGE\s*ALLOW|FLIGHT\s*DURATION|FLIGHT\s*SUMMARY)\b/i.test(txt)||
    new RegExp('\\b(?:'+_FNCODES+')\\s?\\d{2,5}\\b').test(txt);
  if(hotelKw&&!flightKw)r.type='hotel';
  else if(flightKw)r.type='flight';
  else if(/\b(TOUR|ACTIVITY|EXCURSION|EXPERIENCE|ADMISSION|TICKET|CONCERT|SHOW|EVENT)\b/i.test(txt))r.type='activity';
  else r.type='transport';

  // ===== 2. Pre-process: strip noise sections for date extraction =====
  const txtClean=txt
    .replace(/cancellation\s*(?:policy|cost|fee|deadline)[\s\S]*?(?=\n\s*\n|\bYour\s*reservation\b|\bGuest\s*name\b|\bPrice\s*detail|\bTotal\s*price|$)/gi,'')
    .replace(/(?:no.show\s*fee|free\s*cancellation\s*(?:available|until))[\s\S]*?(?=\n\s*\n|$)/gi,'')
    .replace(/(?:prepayment|payment\s*policy)[\s\S]*?(?=\n\s*\n|\bYour\s*reservation\b|$)/gi,'')
    .replace(/Booking\s*date\s*[:]\s*\n?\s*[\w\s,]{1,30}?\d{4}/gi,'')
    .replace(/Date\s*of\s*Issue\s*[:]\s*\n?\s*\d{1,2}\s+\w+\s+\d{4}/gi,'');

  // ===== 3. PNR / Booking reference =====
  const pnrPats=[
    /(?:Booking\s*(?:Ref(?:erence)?|No\.?|Number|ID|Code))\s*[:#]?\s*([A-Z0-9]{4,20})/i,
    /(?:Confirmation\s*(?:Number|Code|#)?)\s*[:#]?\s*([A-Z0-9]{4,20})/i,
    /(?:PNR|RESERVATION\s*CODE|Reference\s*(?:Number|Code|#)?)\s*[:#]?\s*([A-Z0-9]{4,15})/i,
    /(?:Booking\s*reference)\s*[:#]?\s*([A-Z0-9]{4,15})/i,
    /(?:E-?Ticket\s*(?:number|#)?)\s*[:#]?\s*([\d-]{10,20})/i,
  ];
  for(const pat of pnrPats){const m=txt.match(pat);if(m){r.pnr=m[1];r.bookingNumber=m[1];break;}}

  // ===== 4. Hotel name extraction (platform-aware) =====
  if(r.type==='hotel'){
    const hotelPats=[
      /([A-Z][A-Za-z\s&'\-]{2,50})\s+is\s+expecting\s+you/,
      /(?:Hotel|Resort|Property|Accommodation|Stay\s*at)\s*[:#]?\s*([A-Za-z][A-Za-z\s&'\-,]{2,60})(?:\n|$)/i,
      /your\s+stay\s+at\s+([A-Z][A-Za-z\s&'\-]{2,50})/i,
    ];
    for(const pat of hotelPats){const m=txt.match(pat);if(m){r.hotelName=m[1].trim().replace(/\s+/g,' ').slice(0,60);break;}}
  }

  // ===== 5. Airline & flight number =====
  if(r.type==='flight'){
    // Find flight number FIRST, then derive airline from code (more reliable than name matching)
    const fnPats=[
      /(?:Flight|Flt)\s*(?:No\.?|Number|#)?\s*[:#]?\s*([A-Z0-9]{2}\s*\d{2,5})/i,
      new RegExp('\\b('+_FNCODES+')\\s*(\\d{2,5})\\b'),
      // "Firefly FY3122" or "Singapore Airlines . SQ947"
      /(?:Firefly|Singapore\s*Airlines|Scoot|AirAsia|Garuda|Batik\s*Air|Malaysia\s*Airlines|Cathay\s*Pacific)\s*[·•.\s]*\s*([A-Z]{2}\s*\d{2,5})/i,
    ];
    for(const pat of fnPats){const m=txt.match(pat);if(m){
      if(m[2]){r.flightNumber=(m[1]+m[2]).replace(/\s/g,'');if(AIRLINE_MAP[m[1]])r.airline=AIRLINE_MAP[m[1]];}
      else{r.flightNumber=m[1].replace(/\s/g,'');const code=m[1].replace(/\s/g,'').replace(/\d+/,'');if(AIRLINE_MAP[code])r.airline=AIRLINE_MAP[code];}
      break;
    }}
    // Fallback: name-based airline detection (word-boundary safe)
    if(!r.airline){r.airline=_matchAirlineName(txt);}
    // Also check "Operated by" and "AirAsia , AK" style
    if(!r.airline){const opM=txt.match(/(?:Operated\s*by|Depart\s*:)\s*[:\s]*([A-Za-z\s]+?)(?:\s*[·•,]|\s+[A-Z]{2}\d)/i);
      if(opM){const nm=opM[1].trim();const opAl=_matchAirlineName(nm);if(opAl)r.airline=opAl;}}
  }

  // ===== 6. Airport codes & route =====
  const foundAirports=findAirports(txt);
  const distinctAps=[];
  for(const a of foundAirports){if(!distinctAps.length||distinctAps[distinctAps.length-1].code!==a.code)distinctAps.push(a);}
  if(distinctAps.length>=1){r.from=distinctAps[0].city;r.fromCode=distinctAps[0].code;}
  if(distinctAps.length>=2){r.to=distinctAps[1].city;r.toCode=distinctAps[1].code;}
  // Also try "From X to Y" pattern
  if(!r.from||!r.to){const routeM=txt.match(/\bFrom\s+([A-Z][a-z]+(?:\s[A-Z][a-z]+)*)\s+to\s+([A-Z][a-z]+(?:\s[A-Z][a-z]+)*)\b/);
    if(routeM){if(!r.from)r.from=routeM[1];if(!r.to)r.to=routeM[2];}}
  // Also try "City → City" or "City to City" from route headers
  if(!r.from||!r.to){const arrowM=txt.match(/([A-Z][a-z]+(?:\s[A-Z][a-z]+)*)\s*(?:→|->|to)\s*([A-Z][a-z]+(?:\s[A-Z][a-z]+)*)/);
    if(arrowM){if(!r.from)r.from=arrowM[1];if(!r.to)r.to=arrowM[2];}}
  const locSet=new Set(distinctAps.map(a=>a.city));
  CITIES.forEach(c=>{if(t.includes(c.toUpperCase()))locSet.add(c);});
  // Extract location from "Your booking in [Location]"
  const bookingLocM=txt.match(/your\s+booking\s+in\s+([A-Z][A-Za-z\s]{2,30})\s+is/i);
  if(bookingLocM)locSet.add(bookingLocM[1].trim());
  // Extract from address lines (e.g. "80771 Nusa Lembongan, Indonesia")
  const addrM=txt.match(/\d{4,5}\s+([A-Z][A-Za-z\s]{2,30}),\s*(?:Indonesia|Thailand|Malaysia|Philippines|Vietnam|Cambodia|Myanmar|Laos|Sri Lanka|Maldives|Japan|South Korea|China|Taiwan|India|Nepal|Australia|New Zealand)/i);
  if(addrM)locSet.add(addrM[1].trim());
  if(r.from)locSet.add(r.from);if(r.to)locSet.add(r.to);
  r.locations=[...locSet];

  // ===== 7. Seat (flights only) =====
  if(r.type==='flight'){const seat=txt.match(/(?:Seat|SEAT)\s*[:#]?\s*(\d{1,3}[A-HJ-K])/i);if(seat)r.seat=seat[1];}

  // ===== 8. Dates =====
  const dateSrc=r.type==='hotel'?txtClean:txt.replace(/Booking\s*date\s*[:]\s*[\w\s,]+\d{4}/gi,'').replace(/Date\s*of\s*Issue\s*[:]\s*[\w\s]+\d{4}/gi,'');
  // For hotels, try structured check-in/check-out first
  if(r.type==='hotel'){
    const ciM=txt.match(/check.?in\s*[:\n]*\s*(?:\w+day,?\s*)?(\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+\d{4})/i);
    const coM=txt.match(/check.?out\s*[:\n]*\s*(?:\w+day,?\s*)?(\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+\d{4})/i);
    if(ciM){const d=parseDate(ciM[1]);if(d)r.date=d;}
    if(coM){const d=parseDate(coM[1]);if(d)r.dateTo=d;}
  }
  // For flights, try structured "Depart: Day, DD Mon YYYY" patterns
  if(r.type==='flight'&&!r.date){
    const depM=txt.match(/(?:Depart(?:ure|ing)?|DEPARTING)\s*[:\s]*\s*(?:\w+day,?\s*)?(\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+\d{4})/i);
    if(depM){const d=parseDate(depM[1]);if(d)r.date=d;}
    const arrM=txt.match(/(?:Arriv(?:al|ing)?|ARRIVING)\s*[:\s]*[\s\S]*?(\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+\d{4})/i);
    if(arrM){const d=parseDate(arrM[1]);if(d)r.dateTo=d;}
    // SQ e-ticket: "Saturday 25 Jul 2026" on its own line after airport codes
    if(!r.date){const sqDateM=txt.match(/(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s+(\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+\d{4})/i);
      if(sqDateM){const d=parseDate(sqDateM[1]);if(d)r.date=d;}}
  }
  // Generic date extraction as fallback
  if(!r.date){
    const foundDates=[];const curYear=new Date().getFullYear();let m2;
    const dp1=/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+(\d{4})/gi;
    while((m2=dp1.exec(dateSrc))!==null){const mm=MMAP[m2[2].toLowerCase().slice(0,3)];if(mm)foundDates.push(`${m2[3]}-${mm}-${m2[1].padStart(2,'0')}`);}
    if(foundDates.length===0){
      // "Tue, May 26" / "Mon, 25 May" / "Wed, 3 Jun 2026"
      const dp2=/(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)[\w]*[,.]?\s*(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/gi;
      while((m2=dp2.exec(dateSrc))!==null){const mm=MMAP[m2[2].toLowerCase().slice(0,3)];if(mm){
        let yr=curYear;const td2=new Date(yr,parseInt(mm)-1,parseInt(m2[1]));if(td2<new Date(Date.now()-90*864e5))yr++;
        foundDates.push(`${yr}-${mm}-${m2[1].padStart(2,'0')}`);}}
      // "Mon, May 25" format
      const dp2b=/(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)[\w]*[,.]?\s*(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+(\d{1,2})/gi;
      while((m2=dp2b.exec(dateSrc))!==null){const mm=MMAP[m2[1].toLowerCase().slice(0,3)];if(mm){
        let yr=curYear;const td2=new Date(yr,parseInt(mm)-1,parseInt(m2[2]));if(td2<new Date(Date.now()-90*864e5))yr++;
        const ds=`${yr}-${mm}-${m2[2].padStart(2,'0')}`;if(!foundDates.includes(ds))foundDates.push(ds);}}
      // Bare "26 May" or "May 26"
      const dp3=/\b(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/gi;
      while((m2=dp3.exec(dateSrc))!==null){const mm=MMAP[m2[2].toLowerCase().slice(0,3)];if(mm){
        let yr=curYear;const td2=new Date(yr,parseInt(mm)-1,parseInt(m2[1]));if(td2<new Date(Date.now()-90*864e5))yr++;
        const ds=`${yr}-${mm}-${m2[1].padStart(2,'0')}`;if(!foundDates.includes(ds))foundDates.push(ds);}}
    }
    // ISO dates
    const dp4=/(\d{4})-(\d{2})-(\d{2})/g;
    while((m2=dp4.exec(dateSrc))!==null){const ds=m2[0];if(!foundDates.includes(ds))foundDates.push(ds);}
    // "10 AUG , 2026" format (with comma between month and year)
    const dp5=/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s*,?\s*(\d{4})/gi;
    while((m2=dp5.exec(dateSrc))!==null){const mm=MMAP[m2[2].toLowerCase().slice(0,3)];if(mm){const ds=`${m2[3]}-${mm}-${m2[1].padStart(2,'0')}`;if(!foundDates.includes(ds))foundDates.push(ds);}}
    const uniqueDates=[...new Set(foundDates)].sort();
    if(uniqueDates.length>=1)r.date=uniqueDates[0];
    if(uniqueDates.length>=2&&!r.dateTo)r.dateTo=uniqueDates[uniqueDates.length-1];
  }

  // ===== 9. Times (flights only) =====
  if(r.type==='flight'){
    // Try structured patterns first
    const depTimeM=txt.match(/(?:Depart(?:ing|ure)?\s*(?:At|Time)?\s*[:#]?\s*|DEPARTING\s*\n?\s*)(\d{1,2}:\d{2}\s*(?:am|pm)?)/i);
    const arrTimeM=txt.match(/(?:Arriv(?:al|ing)\s*(?:At|Time)?\s*[:#]?\s*|ARRIVING\s*\n?\s*)(\d{1,2}:\d{2}\s*(?:am|pm)?)/i);
    if(depTimeM)r.departureTime=depTimeM[1].trim();
    if(arrTimeM)r.arrivalTime=arrTimeM[1].trim();
    // Airport-code-prefixed times: "DPS 12:10" / "SIN 14:55" (SQ e-ticket format)
    if(!r.departureTime&&r.fromCode){const acM=txt.match(new RegExp(r.fromCode+'\\s+(\\d{1,2}:\\d{2})'));if(acM)r.departureTime=acM[1];}
    if(!r.arrivalTime&&r.toCode){const acM=txt.match(new RegExp(r.toCode+'\\s+(\\d{1,2}:\\d{2})'));if(acM)r.arrivalTime=acM[1];}
    // Fallback: first two times in text
    if(!r.departureTime){
      const times=[];const seenT=new Set();let m2;
      const tp=/\b(\d{1,2}:\d{2}\s*(?:am|pm)?)\b/gi;
      while((m2=tp.exec(txt))!==null){const v=m2[1].trim();const h=parseInt(v);if(h>=0&&h<=23&&!seenT.has(v)){times.push(v);seenT.add(v);}}
      if(times.length>=1)r.departureTime=times[0];
      if(times.length>=2)r.arrivalTime=times[1];
    }
  }

  // ===== 10. Cost — with currency symbol mapping =====
  const costPats=[
    // "Grand total: IDR 2,320,000"
    /(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare)?|TOTAL)\s*[:#]?\s*(SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD|CNY|MVR|EGP|TWD|KRW)\s*([\d,]+\.?\d*)/i,
    // "Total S$ 79.10" or "Total Rp 3,106,856"
    /(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare)?|TOTAL)\s*[:#]?\s*(?:Rp\.?|RM|S\$|A\$|₱|¥|฿|€|£|\$)\s*([\d,]+\.?\d*)/i,
    // "SGD235.20" (no space)
    /(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare)?|TOTAL)\s*[:#]?\s*(SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD|CNY)([\d,]+\.?\d*)/i,
    // "Total 3,106,856" (amount only)
    /(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare)?)\s*[:#]?\s*[\$]?\s*([\d,]+\.?\d{0,2})\b/i,
  ];
  for(const pat of costPats){const m=txt.match(pat);if(m){
    if(m[2]){
      if(/^[A-Z]{3}$/.test(m[1])){r.currency=m[1].toUpperCase();r.cost=m[2].replace(/,/g,'');}
      else{r.cost=m[1].replace(/,/g,'');if(/^[A-Z]{3}$/.test(m[2]))r.currency=m[2].toUpperCase();}
    }else{r.cost=m[1].replace(/,/g,'');}
    break;
  }}
  // Detect currency from context near total
  if(r.cost&&!r.currency){
    const totalCtx=txt.match(/(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare)?)\s*[:#]?\s*(.{0,30})/i);
    if(totalCtx){const ctx=totalCtx[1].toLowerCase();
      for(const[sym,iso]of Object.entries(CURRENCY_SYMBOLS)){if(ctx.includes(sym)){r.currency=iso;break;}}}
  }
  // Fallback: any "MYR 95.04" or "IDR 2,320,000" pattern
  if(!r.cost){const cm=txt.match(/(SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD)\s*([\d,]+\.?\d*)/i);if(cm){r.currency=cm[1].toUpperCase();r.cost=cm[2].replace(/,/g,'');}}
  if(!r.cost){const symCost=txt.match(/\b(Rp\.?|RM|S\$|A\$)\s*([\d,]+\.?\d*)/i);
    if(symCost){r.cost=symCost[2].replace(/,/g,'');const sym=symCost[1].toLowerCase().replace(/\.$/,'');r.currency=CURRENCY_SYMBOLS[sym]||'SGD';}}

  // ===== 11. Hotel extras: room type, nights =====
  if(r.type==='hotel'){
    const nightsM=txt.match(/(\d+)\s*nights?\b/i);if(nightsM)r.nights=parseInt(nightsM[1]);
    const roomM=txt.match(/\d+\s*nights?,\s*(.+?)(?:\n|$)/i);if(roomM)r.roomType=roomM[1].trim().slice(0,60);
  }

  // ===== 12. Flight duration =====
  if(r.type==='flight'){const durM=txt.match(/(?:Duration|Non-stop)\s*[,:.]?\s*(\d+)\s*h(?:rs?|ours?)?\s*(\d+)\s*m(?:in)?/i);
    if(durM)r.duration=durM[1]+'h '+durM[2]+'m';}

  // ===== 13. Build display name =====
  if(r.type==='flight')r.name=r.airline?`${r.airline} ${r.flightNumber||'Flight'}`+(r.from&&r.to?` (${r.from} → ${r.to})`:''):(r.from&&r.to?`${r.from} → ${r.to}`:'Flight');
  else if(r.type==='hotel')r.name=r.hotelName||(r.locations.length?r.locations[0]+' Hotel':'Hotel Booking');
  else r.name=r.locations.join(' → ')||'Uploaded Booking';
  return r;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,ev=S.events.find(t=>t.id===S.tid);
  switch(a){
    case 'nav':nav(el.dataset.to);break;
    case 'view':nav('detail',{tid:el.dataset.id,tab:'timeline'});break;
    case 'add-event':fEvent();break;
    case 'export-event':showExportModal(el.dataset.id);break;
    case 'edit-event':{const t=S.events.find(x=>x.id===el.dataset.id);if(t)fEvent(t);break;}
    case 'del-event':{const delId=el.dataset.id;const delEv=S.events.find(t=>t.id===delId);if(delEv){const bc=(delEv.flights||[]).length+(delEv.hotels||[]).length+(delEv.activities||[]).length+(delEv.transport||[]).length;modal('Delete Event',`<div class="confirm-modal-body"><div class="cm-icon">⚠️</div><div class="cm-title">Delete "${esc(delEv.name)}"?</div><div class="cm-sub">${bc?'This will remove <strong>'+bc+' booking'+(bc>1?'s':'')+'</strong> (flights, hotels, activities, transport).':'This trip has no bookings.'}<br>This action cannot be undone.</div></div>`,()=>{const idx=S.events.indexOf(delEv);S.events.splice(idx,1);saveS();nav('events');toast('Event deleted');},{saveLabel:'Delete',danger:true});}}break;
    case 'tab':S.tab=el.dataset.t;saveS();render();break;
    case 'fy':S.tfY=el.dataset.y?parseInt(el.dataset.y):null;S._catFilter='all';saveS();render();break;
    case 'cat-filter':S._catFilter=el.dataset.cat||'all';S.tfY=null;saveS();render();break;
    case 'cat-group':S._catGroup=!S._catGroup;saveS();render();break;
    case 'sly':S.ly=parseInt(el.dataset.y);saveS();render();break;
    case 'aly':{const y=prompt('Year:');if(y&&parseInt(y)){S.leave[parseInt(y)]={jobs:[{employer:'',startDate:'',endDate:'',al:0,bp:0,ot:0,ph:0,taken:0}],holidays:[]};S.ly=parseInt(y);saveS();render();}break;}
    case 'add-job':{const y=S.ly||2026;if(!S.leave[y])S.leave[y]={jobs:[],holidays:[],applied:[]};if(!S.leave[y].jobs)S.leave[y]=migrateLeaveJobs(S.leave[y]);S.leave[y].jobs.push({employer:'',startDate:'',endDate:'',al:0,bp:0,ot:0,ph:0,taken:0});saveS();render();break;}
    case 'del-job':{const y=S.ly||2026;const ji=parseInt(el.dataset.ji);if(S.leave[y]&&S.leave[y].jobs&&S.leave[y].jobs.length>0){S.leave[y].jobs.splice(ji,1);saveS();render();}break;}
    case 'add-applied':{const y=S.ly||2026;if(!S.leave[y])S.leave[y]={jobs:[{employer:'',al:0,bp:0,ot:0,ph:0,taken:0}],holidays:[],applied:[]};if(!S.leave[y].applied)S.leave[y].applied=[];
      modal('Add Leave Applied',`<div class="fg">
        <div class="fi"><label>From</label><input class="fc" type="date" name="la-from"></div>
        <div class="fi"><label>To</label><input class="fc" type="date" name="la-to"></div>
        <div class="fi full"><label>Note</label><input class="fc" name="la-note" placeholder="e.g. Japan trip, Sick leave"></div>
      </div>`,()=>{const m=document.querySelector('.modal');const f=m.querySelector('[name="la-from"]').value;const t=m.querySelector('[name="la-to"]').value;const n=m.querySelector('[name="la-note"]').value;if(f){S.leave[y].applied.push({from:f,to:t||f,note:n});saveS();render();toast('Leave added');}});break;}
    case 'del-applied':{const y=S.ly||2026;const ai=parseInt(el.dataset.ai);if(S.leave[y]&&S.leave[y].applied){const entry=S.leave[y].applied[ai];S.leave[y].applied.splice(ai,1);saveS();render();toastUndo('Leave entry removed',()=>{S.leave[y].applied.splice(ai,0,entry);saveS();render();});}break;}
    case 'add-flight':if(ev)fFlight(ev);break;
    case 'edit-flight':{if(ev){const f=ev.flights.find(x=>x.id===el.dataset.eid);if(f)fFlight(ev,f);}break;}
    case 'del-flight':{if(ev){const eid=el.dataset.eid;const entry=ev.flights.find(x=>x.id===eid);if(entry){const idx=ev.flights.indexOf(entry);ev.flights.splice(idx,1);saveS();render();toastUndo('Flight deleted',()=>{ev.flights.splice(idx,0,entry);saveS();render();});}}}break;
    case 'dup-flight':{if(ev){const f=ev.flights.find(x=>x.id===el.dataset.eid);if(f){const dup={...f,id:uid(),from:f.to,to:f.from,departureTime:'',arrivalTime:'',duration:'',flightNumber:'',seat:'',notes:'Return flight'};fFlight(ev,dup);}}}break;
    case 'add-hotel':if(ev)fHotel(ev);break;
    case 'edit-hotel':{if(ev){const h=ev.hotels.find(x=>x.id===el.dataset.eid);if(h)fHotel(ev,h);}break;}
    case 'del-hotel':{if(ev){const eid=el.dataset.eid;const entry=ev.hotels.find(x=>x.id===eid);if(entry){const idx=ev.hotels.indexOf(entry);ev.hotels.splice(idx,1);saveS();render();toastUndo('Hotel deleted',()=>{ev.hotels.splice(idx,0,entry);saveS();render();});}}}break;
    case 'add-act':if(ev)fAct(ev);break;
    case 'edit-act':{if(ev){const x=ev.activities.find(x=>x.id===el.dataset.eid);if(x)fAct(ev,x);}break;}
    case 'del-act':{if(ev){const eid=el.dataset.eid;const entry=ev.activities.find(x=>x.id===eid);if(entry){const idx=ev.activities.indexOf(entry);ev.activities.splice(idx,1);saveS();render();toastUndo('Activity deleted',()=>{ev.activities.splice(idx,0,entry);saveS();render();});}}}break;
    case 'add-trans':if(ev)fTrans(ev);break;
    case 'edit-trans':{if(ev){const x=ev.transport.find(x=>x.id===el.dataset.eid);if(x)fTrans(ev,x);}break;}
    case 'del-trans':{if(ev){const eid=el.dataset.eid;const entry=ev.transport.find(x=>x.id===eid);if(entry){const idx=ev.transport.indexOf(entry);ev.transport.splice(idx,1);saveS();render();toastUndo('Transport deleted',()=>{ev.transport.splice(idx,0,entry);saveS();render();});}}}break;
    case 'xm':xm();break;
    case 'cal-prev':if(S.calM===0){S.calM=11;S.calY--;}else S.calM--;saveS();render();break;
    case 'cal-next':if(S.calM===11){S.calM=0;S.calY++;}else S.calM++;saveS();render();break;
    case 'cal-today':{const now=new Date();S.calM=now.getMonth();S.calY=now.getFullYear();saveS();render();break;}
    case 'ics-upcoming':exportUpcomingICS();break;
    case 'ics-all':generateICS();break;
    case 'export':{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a2=document.createElement('a');a2.href=URL.createObjectURL(b);a2.download='holiday-tracker.json';a2.click();toast('Exported');break;}
    case 'export-csv':{
      const csvRows=[['Event','Start','End','Locations','Days','Flights','Hotels','Activities','Transport','Total Cost (SGD)']];
      S.events.sort((a2,b2)=>a2.startDate.localeCompare(b2.startDate)).forEach(t2=>{
        const d2=days(t2.startDate,t2.endDate);
        const csvEsc=v=>{const s=String(v||'');return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;};
        csvRows.push([csvEsc(t2.name),t2.startDate,t2.endDate,csvEsc(t2.locations.join('; ')),d2,(t2.flights||[]).length,(t2.hotels||[]).length,(t2.activities||[]).length,(t2.transport||[]).length,eCost(t2).toFixed(2)]);
      });
      const csvStr=csvRows.map(r=>r.join(',')).join('\n');
      const b3=new Blob([csvStr],{type:'text/csv'});const a3=document.createElement('a');a3.href=URL.createObjectURL(b3);a3.download='holiday-tracker-events.csv';a3.click();toast('CSV exported');break;}
    case 'import':document.getElementById('imp-f').click();break;
    case 'restore-backup':{const bk=localStorage.getItem('htV5_backup');const bkTs=localStorage.getItem('htV5_backup_ts')||'unknown';if(bk&&confirm('Restore backup from '+bkTs+'? This will merge backup events with current data.')){try{const bd=JSON.parse(bk);if(bd.events){S.events=mergeEvents(S.events||[],bd.events);S.lastModified=Date.now();saveS();render();pushToGist();toast('Restored '+(bd.events||[]).length+' events from backup');}}catch(e2){toast('Backup corrupted');}}break;}
    case 'reset':if(confirm('Reset ALL data? This cannot be undone.')){localStorage.removeItem('htV4');localStorage.removeItem('htV5');S=defS();saveS();render();toast('Data reset');}break;
    case 'sync-connect':connectSync();break;
    case 'dash-sync-connect':connectSyncFromDash();break;
    case 'sync-disconnect':disconnectSync();break;
    case 'sync-now':fullSync();break;
    case 'link-device':linkDevice();break;
    case 'sync-push':pushToGist().then(()=>toast('Pushed to cloud'));break;
    case 'sync-pull':pullFromGist().then(pulled=>{if(pulled)toast('Pulled from cloud');else toast('Already up to date');});break;
    case 'entry-sort-dir':sortDir=sortDir==='asc'?'desc':'asc';render();break;
    case 'event-sort-dir':eventSortDir=eventSortDir==='asc'?'desc':'asc';render();break;
  }
});

document.addEventListener('change',e=>{
  if(e.target.matches('[data-action="entry-sort-key"]')){sortKey=e.target.value;render();}
  if(e.target.matches('[data-action="event-sort-key"]')){eventSortKey=e.target.value;render();}
  if(e.target.matches('[data-action="tp-change"]')){S._tp=e.target.value;saveS();render();}
  if(e.target.matches('[data-action="tp-from"]')){S._tpFrom=e.target.value;saveS();render();}
  if(e.target.matches('[data-action="tp-to"]')){S._tpTo=e.target.value;saveS();render();}
});

document.addEventListener('change',e=>{if(e.target.id==='imp-f'&&e.target.files.length){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.events||d.trips){if(d.trips&&!d.events){d.events=d.trips.map(t=>({...t,category:'trip',requiresLeave:true}));delete d.trips;}S=d;saveS();render();toast('Imported');}}catch(e2){toast('Error');}};r.readAsText(e.target.files[0]);}});
// Search input handler
document.addEventListener('input',e=>{
  if(e.target.matches('[data-action="search-events"]')){S._searchQ=e.target.value;render();
    // Re-focus after render
    setTimeout(()=>{const inp=document.querySelector('[data-action="search-events"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}},10);
  }
});

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){xm();closeMobileMenu();}
  // Don't trigger shortcuts when typing in inputs
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key==='1')nav('dashboard');
  else if(e.key==='2')nav('events');
  else if(e.key==='3')nav('calendar');
  else if(e.key==='4')nav('leave');
  else if(e.key==='5')nav('budget');
  else if(e.key==='6')nav('settings');
  else if(e.key==='n'&&!e.ctrlKey&&!e.metaKey)fEvent();
  else if(e.key==='u'&&!e.ctrlKey&&!e.metaKey)showSmartUpload();
  else if(e.key==='/'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();const si=document.querySelector('[data-action="search-events"]');if(si)si.focus();else nav('events');}
});

// Hamburger
document.getElementById('hamburger').onclick=toggleMobileMenu;
document.getElementById('sidebar-overlay').onclick=closeMobileMenu;
// Close mobile menu when navigating
const origNav=nav;
nav=function(v,x){closeMobileMenu();origNav(v,x);};

// FAB
document.getElementById('fab').onclick=()=>showSmartUpload();

// Tesseract lazy load
(function(){if(typeof Tesseract==='undefined'){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';document.head.appendChild(s);}})();

// Build datalists for airline and location autocomplete
(function(){
  const alDl=document.createElement('datalist');alDl.id='airline-list';
  AIRLINE_NAMES.forEach(a=>{const o=document.createElement('option');o.value=a;alDl.appendChild(o);});
  document.body.appendChild(alDl);
  const locDl=document.createElement('datalist');locDl.id='location-list';
  const locSet=new Set();
  Object.entries(AIRPORTS).forEach(([code,city])=>{locSet.add(city);locSet.add(city+' ('+code+')');});
  CITIES.forEach(c=>locSet.add(c));
  [...locSet].sort().forEach(l=>{const o=document.createElement('option');o.value=l;locDl.appendChild(o);});
  document.body.appendChild(locDl);
})();

// Init
try{render();
  // Auto-sync on load
  const _initConf=getSyncConfig();
  if(_initConf.token){setTimeout(()=>fullSync(),800);}
  else if(_initConf.gistId){
    // Arrived via link — pull data anonymously (read-only, no token needed)
    setTimeout(()=>pullGistAnon(_initConf.gistId),500);
  }
}catch(e){console.error('Render error:',e);document.getElementById('app').innerHTML='<div style="padding:40px;color:#ff6b6b"><h2>Error loading app</h2><pre style="margin-top:12px;font-size:12px;white-space:pre-wrap;color:#e8e9ed">'+e.message+'\n\n'+e.stack+'</pre><button onclick="localStorage.removeItem(\'htV4\');localStorage.removeItem(\'htV3\');location.reload()" style="margin-top:16px;padding:8px 16px;background:#6c8cff;color:#fff;border:none;border-radius:8px;cursor:pointer">Reset &amp; Reload</button></div>';}

// Near-realtime sync: poll + visibility
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    const vc=getSyncConfig();
    if(vc.token)fullSync();
    else if(vc.gistId)pullGistAnon(vc.gistId);
  }
});
window.addEventListener('focus',()=>{
  const fc=getSyncConfig();
  if(fc.token)pullFromGist().then(pulled=>{if(pulled){render();toast('Synced from cloud');}});
  else if(fc.gistId)pullGistAnon(fc.gistId);
});
window.addEventListener('beforeunload',()=>{
  if(_syncTimer){clearTimeout(_syncTimer);pushToGist();}
});
startSyncPolling();
setInterval(()=>{try{renderSidebar();}catch(e){}},60000);

// Offline detection
const _ob=document.createElement('div');_ob.className='offline-banner';_ob.textContent='You are offline — changes will sync when reconnected';document.body.appendChild(_ob);
window.addEventListener('online',()=>{_ob.classList.remove('show');if(getSyncConfig().token)pushToGist();});
window.addEventListener('offline',()=>_ob.classList.add('show'));
if(!navigator.onLine)_ob.classList.add('show');
</script>
</body>
</html>
