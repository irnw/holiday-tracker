<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Holiday Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ========== THEME VARIABLES ========== */
[data-theme="dark"]{
  --bg:#0a0a0f;--bg2:#12121a;--sidebar-bg:#08080d;--sidebar-hover:rgba(255,255,255,.06);--sidebar-active:rgba(108,140,255,.12);
  --card:rgba(255,255,255,.04);--card-hover:rgba(255,255,255,.07);--primary:#6c8cff;--primary-dim:rgba(108,140,255,.12);--primary-glow:rgba(108,140,255,.3);
  --accent:#ff6b6b;--accent-dim:rgba(255,107,107,.12);--green:#4ade80;--green-dim:rgba(74,222,128,.12);
  --orange:#fb923c;--orange-dim:rgba(251,146,60,.12);--purple:#a78bfa;--purple-dim:rgba(167,139,250,.12);
  --text:#f0f0f5;--text2:#8888a0;--text3:#4a4a60;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --input-bg:rgba(255,255,255,.06);--radius:14px;--shadow:0 0 0 1px rgba(255,255,255,.06);--shadow2:0 12px 40px rgba(0,0,0,.7);
  --header-bg:rgba(10,10,15,.9);--overlay:rgba(0,0,0,.85);
  --sg:#6c8cff;--sg-dim:rgba(108,140,255,.14);--my:#fb923c;--my-dim:rgba(251,146,60,.14);
  --glass:rgba(255,255,255,.04);--glass-border:rgba(255,255,255,.08);
  --glow-1:#6c8cff;--glow-2:#a78bfa;
}
[data-theme="light"]{
  --bg:#f8f8fc;--bg2:#ededf4;--sidebar-bg:#0c0c14;--sidebar-hover:rgba(255,255,255,.08);--sidebar-active:rgba(108,140,255,.15);
  --card:#ffffff;--card-hover:#f5f5fa;--primary:#4a6cf7;--primary-dim:rgba(74,108,247,.07);--primary-glow:rgba(74,108,247,.18);
  --accent:#e84057;--accent-dim:rgba(232,64,87,.07);--green:#16a34a;--green-dim:rgba(22,163,74,.07);
  --orange:#ea7e2e;--orange-dim:rgba(234,126,46,.07);--purple:#7c3aed;--purple-dim:rgba(124,58,237,.07);
  --text:#0c0c14;--text2:#52526a;--text3:#9898ae;--border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.12);
  --input-bg:#ffffff;--radius:14px;--shadow:0 0 0 1px rgba(0,0,0,.05);--shadow2:0 12px 40px rgba(0,0,0,.1);
  --header-bg:rgba(248,248,252,.92);--overlay:rgba(0,0,0,.5);
  --sg:#4a6cf7;--sg-dim:rgba(74,108,247,.1);--my:#ea7e2e;--my-dim:rgba(234,126,46,.1);
  --glass:rgba(0,0,0,.02);--glass-border:rgba(0,0,0,.07);
  --glow-1:#4a6cf7;--glow-2:#7c3aed;
}

body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:var(--primary);text-decoration:none}

/* ========== SIDEBAR ========== */
.sidebar{width:220px;background:var(--sidebar-bg);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;border-right:1px solid var(--glass-border)}
.sidebar-brand{padding:24px 16px 20px;display:flex;align-items:center;gap:10px}
.sidebar-brand .logo{width:32px;height:32px;background:linear-gradient(135deg,var(--glow-1),var(--glow-2));border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(59,130,246,.3)}
.sidebar-brand .logo svg{width:18px;height:18px;color:#fff}
.sidebar-brand h1{font-size:11px;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:2px;text-transform:uppercase}
.nav{flex:1;padding:8px}
.nav-section{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.25);padding:20px 12px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;transition:all .15s;font-size:13px;border-radius:8px;color:rgba(255,255,255,.45);margin-bottom:2px;font-weight:400}
.nav-item:hover{background:var(--sidebar-hover);color:rgba(255,255,255,.75)}
.nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.6}
.nav-item.active svg{opacity:1}
.sidebar-footer{padding:12px 8px;border-top:1px solid rgba(255,255,255,.06)}
.theme-toggle{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-radius:8px;font-size:12px;color:rgba(255,255,255,.4);transition:all .15s}
.theme-toggle:hover{background:var(--sidebar-hover);color:rgba(255,255,255,.7)}
.theme-toggle svg{width:16px;height:16px}

/* ========== MAIN ========== */
.main{margin-left:220px;flex:1;min-height:100vh}
.page-header{padding:24px 32px 20px;background:var(--header-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.page-header h2{font-size:20px;font-weight:700;letter-spacing:-.3px}
.page-header .subtitle{color:var(--text3);font-size:12px;margin-top:3px;font-weight:400}
.page-content{padding:24px 32px 48px}

/* ========== CARDS ========== */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--glass-border);box-shadow:var(--shadow);transition:background .3s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:13px;font-weight:600;letter-spacing:-.1px}
.card-body{padding:20px}

#app{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ========== STATS ========== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border-radius:var(--radius);padding:20px;border:1px solid var(--glass-border);backdrop-filter:blur(12px);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.stat .s-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.stat .s-val{font-size:28px;font-weight:800;margin-top:6px;line-height:1.1;letter-spacing:-.5px}
.stat .s-sub{font-size:11px;color:var(--text2);margin-top:6px}
.stat.blue .s-val{color:var(--primary)}.stat.green .s-val{color:var(--green)}.stat.orange .s-val{color:var(--orange)}.stat.red .s-val{color:var(--accent)}.stat.purple .s-val{color:var(--purple)}

/* ========== TRIPS ========== */
.trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.trip-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--glass-border);cursor:pointer;transition:all .25s;overflow:hidden;position:relative;backdrop-filter:blur(12px)}
.trip-card:hover{border-color:rgba(59,130,246,.3);box-shadow:0 0 0 1px rgba(59,130,246,.15),0 8px 32px rgba(0,0,0,.3);transform:translateY(-2px)}
.trip-accent{height:2px;background:linear-gradient(90deg,var(--glow-1),var(--glow-2));opacity:.8}
.trip-body{padding:18px 20px}
.trip-name{font-size:15px;font-weight:600;margin-bottom:4px;letter-spacing:-.2px}
.trip-dates{font-size:12px;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.trip-locs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.loc{background:var(--primary-dim);color:var(--primary);font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600;letter-spacing:.2px;text-transform:uppercase}
.trip-foot{display:flex;gap:14px;font-size:11px;color:var(--text3)}
.trip-foot b{color:var(--text);font-weight:600}

/* ========== BUTTONS ========== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;font-family:inherit}
.btn-p{background:var(--primary);color:#fff;border-color:var(--primary)}.btn-p:hover{filter:brightness(1.15);box-shadow:0 0 20px rgba(59,130,246,.25)}
.btn-s{background:var(--input-bg);color:var(--text);border-color:var(--border)}.btn-s:hover{border-color:var(--text3)}
.btn-d{background:var(--accent-dim);color:var(--accent);border-color:transparent}.btn-d:hover{background:rgba(244,63,94,.15)}
.btn-ghost{background:none;color:var(--text3);border:none;padding:6px 10px}.btn-ghost:hover{color:var(--text);background:var(--primary-dim)}

/* ========== FORMS ========== */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fi{display:flex;flex-direction:column;gap:3px}
.fi.full{grid-column:1/-1}
.fi label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.3px}
input.fc,select.fc,textarea.fc{padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--input-bg);color:var(--text);transition:border .15s;outline:none}
input.fc:focus,select.fc:focus,textarea.fc:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-glow)}
textarea.fc{resize:vertical;min-height:50px}

/* ========== TABS ========== */
.tabs{display:flex;gap:2px;margin-bottom:18px;background:var(--bg2);border-radius:10px;padding:3px;border:1px solid var(--glass-border)}
.tab{padding:7px 16px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-radius:8px;transition:all .15s;text-align:center;flex:1}
.tab:hover{color:var(--text)}
.tab.active{background:var(--card);color:var(--primary);box-shadow:0 0 0 1px var(--glass-border)}

/* ========== ENTRY CARDS ========== */
.entry{background:var(--card);border:1px solid var(--glass-border);border-radius:10px;padding:14px 16px;margin-bottom:10px;transition:all .2s;backdrop-filter:blur(8px)}
.entry:hover{border-color:rgba(59,130,246,.2)}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.entry-top h4{font-size:13px;font-weight:600}
.entry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;font-size:12px}
.eg{display:flex;flex-direction:column;gap:1px}
.eg .ek{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.eg .ev{font-weight:500;color:var(--text)}

/* ========== MODAL ========== */
.modal-bg{display:none;position:fixed;inset:0;background:var(--overlay);z-index:200;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border-radius:16px;width:100%;max-width:600px;box-shadow:0 24px 80px rgba(0,0,0,.5);border:1px solid var(--glass-border);animation:mIn .25s}
@keyframes mIn{from{opacity:0;transform:translateY(-12px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:15px;font-weight:600}
.modal-x{width:28px;height:28px;border:none;background:none;cursor:pointer;color:var(--text3);font-size:18px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--bg2)}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* ========== DROPZONE ========== */
.dz{border:2px dashed var(--border);border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg2)}
.dz:hover,.dz.over{border-color:var(--primary);background:var(--primary-dim)}
.dz p{font-size:12px;color:var(--text2)}.dz .sm{font-size:11px;color:var(--text3);margin-top:3px}
.dz-icon{width:36px;height:36px;margin:0 auto 8px;background:var(--primary-dim);border-radius:10px;display:flex;align-items:center;justify-content:center}
.dz-icon svg{width:18px;height:18px;color:var(--primary)}
.ocr-prog{margin-top:8px;font-size:11px;color:var(--primary);display:flex;align-items:center;gap:6px}
.ocr-prog .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ocr-out{margin-top:8px;padding:8px 10px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;font-size:11px;max-height:120px;overflow-y:auto;white-space:pre-wrap;color:var(--text2);font-family:'SF Mono',Monaco,monospace}

/* ========== CALENDAR ========== */
.cal-nav{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.cal-nav h3{font-size:16px;font-weight:700;min-width:180px;letter-spacing:-.3px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;border:1px solid var(--glass-border)}
.cal-head{background:var(--bg2);padding:8px;text-align:center;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.cal-day{background:var(--bg);min-height:80px;padding:4px 6px;font-size:11px;position:relative;cursor:pointer;transition:background .15s}
.cal-day:hover{background:var(--card-hover)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--primary)}
.cal-day.other{opacity:.2}
.cal-day .d-num{font-weight:600;margin-bottom:2px;font-size:12px}
.cal-day .d-num.weekend{color:var(--accent)}
.cal-day .d-ph{font-size:8px;font-weight:600;margin-bottom:1px;padding:1px 4px;border-radius:3px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-day .d-ph.ph-sg{background:var(--sg-dim);color:var(--sg)}
.cal-day .d-ph.ph-my{background:var(--my-dim);color:var(--my)}
.cal-trip{font-size:9px;padding:1px 4px;border-radius:3px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:500;color:#fff}

/* ========== LEAVE ========== */
.leave-boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:24px}
.lb{padding:18px 14px;border-radius:var(--radius);text-align:center;border:1px solid var(--glass-border);position:relative;overflow:hidden;backdrop-filter:blur(8px)}
.lb::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
.lb .lv{font-size:26px;font-weight:800;letter-spacing:-.5px}
.lb .ll{font-size:9px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.lb.t-total{background:var(--primary-dim);color:var(--primary)}
.lb.t-taken{background:var(--accent-dim);color:var(--accent)}
.lb.t-bal{background:var(--green-dim);color:var(--green)}
.lb.t-ot{background:var(--orange-dim);color:var(--orange)}
.lb.t-al{background:var(--purple-dim);color:var(--purple)}
.lb.t-req{background:rgba(244,63,94,.06);color:var(--accent);border-color:rgba(244,63,94,.15)}
.lb.t-applied{background:rgba(16,185,129,.06);color:var(--green);border-color:rgba(16,185,129,.15)}

/* ========== BUDGET ========== */
.b-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
.b-row:last-child{border:none}
.b-total{background:var(--primary-dim);padding:12px 14px;border-radius:0 0 var(--radius) var(--radius);display:flex;justify-content:space-between;font-weight:600}

/* ========== TAGS ========== */
.tag{display:inline-flex;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.tag-b{background:var(--primary-dim);color:var(--primary)}
.tag-g{background:var(--green-dim);color:var(--green)}
.tag-r{background:var(--accent-dim);color:var(--accent)}
.tag-o{background:var(--orange-dim);color:var(--orange)}

/* ========== YEAR TABS ========== */
.ytabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.yt{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;background:transparent;color:var(--text3);border:1px solid var(--glass-border);transition:all .15s}
.yt:hover{border-color:var(--text3);color:var(--text2)}.yt.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 0 16px rgba(59,130,246,.25)}

/* ========== QUICK UPLOAD FAB ========== */
.fab{position:fixed;bottom:24px;right:28px;width:52px;height:52px;background:linear-gradient(135deg,var(--glow-1),var(--glow-2));border:none;border-radius:14px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(59,130,246,.35);transition:all .25s;z-index:90}
.fab:hover{transform:scale(1.08);box-shadow:0 8px 32px rgba(59,130,246,.45)}
.fab svg{width:22px;height:22px}

/* ========== TOAST ========== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--glass-border);color:var(--text);padding:10px 20px;border-radius:10px;font-size:13px;z-index:300;animation:tIn .3s;box-shadow:0 8px 32px rgba(0,0,0,.4);backdrop-filter:blur(12px)}
@keyframes tIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ========== SMART UPLOAD ========== */
.su-match{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:12px}
.su-match h4{font-size:13px;font-weight:600;margin-bottom:8px}
.su-field{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid var(--border)}
.su-field:last-child{border:none}
.su-field .k{color:var(--text3)}.su-field .v{font-weight:500;color:var(--text)}

.shared-link{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--primary-dim);border-radius:8px;font-size:12px;word-break:break-all;margin-top:6px}

.empty{text-align:center;padding:40px 16px;color:var(--text3)}.empty p{margin-bottom:12px;font-size:13px}
.back-link{display:inline-flex;align-items:center;gap:4px;color:var(--text2);font-size:12px;cursor:pointer;padding:2px 0;margin-bottom:12px}.back-link:hover{color:var(--text)}
.rate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.rate-item{display:flex;align-items:center;gap:6px;padding:8px;background:var(--bg2);border-radius:8px}
.rate-item label{font-size:11px;font-weight:600;min-width:36px;color:var(--text2)}
.rate-item input{flex:1;padding:5px 7px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--input-bg);color:var(--text)}

::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* ========== HAMBURGER MENU ========== */
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:110;width:40px;height:40px;border:none;background:var(--card);border-radius:10px;cursor:pointer;color:var(--text);box-shadow:var(--shadow);align-items:center;justify-content:center}
.hamburger svg{width:20px;height:20px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:95;backdrop-filter:blur(2px)}
.sidebar-overlay.open{display:block}

/* ========== UNDO TOAST ========== */
.toast-undo{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--glass-border);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;z-index:300;animation:tIn .3s;box-shadow:0 8px 32px rgba(0,0,0,.4);display:flex;align-items:center;gap:12px;backdrop-filter:blur(12px)}
.toast-undo .undo-btn{background:var(--primary);color:#fff;border:none;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;font-family:inherit}
.toast-undo .undo-btn:hover{filter:brightness(1.15)}
.toast-undo .undo-timer{width:60px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.toast-undo .undo-timer-bar{height:100%;background:var(--primary);transition:width linear}

/* ========== STATUS BADGES ========== */
.badge{display:inline-flex;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.badge-upcoming{background:var(--primary-dim);color:var(--primary)}
.badge-active{background:var(--green-dim);color:var(--green);animation:pulse 2s infinite}
.badge-completed{background:var(--bg2);color:var(--text3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

/* ========== SEARCH BAR ========== */
.search-bar{position:relative;flex:1;max-width:320px}
.search-bar input{width:100%;padding:7px 12px 7px 32px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--input-bg);color:var(--text);outline:none;font-family:inherit}
.search-bar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.search-bar svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text3)}

/* ========== TIMELINE ========== */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border);border-radius:1px}
.tl-item{position:relative;margin-bottom:16px;padding-left:12px}
.tl-item::before{content:'';position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--primary);background:var(--card)}
.tl-item.tl-flight::before{border-color:var(--primary);background:var(--primary-dim)}
.tl-item.tl-hotel::before{border-color:var(--green);background:var(--green-dim)}
.tl-item.tl-activity::before{border-color:var(--orange);background:var(--orange-dim)}
.tl-item.tl-transport::before{border-color:var(--purple);background:var(--purple-dim)}
.tl-date{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.tl-content{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12px}
.tl-content h4{font-size:12px;font-weight:600;margin-bottom:2px}
.tl-content .tl-sub{color:var(--text2);font-size:11px}

/* ========== BUDGET CHART ========== */
.budget-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.budget-bar .bb-label{min-width:80px;color:var(--text2);font-weight:500;text-align:right}
.budget-bar .bb-track{flex:1;height:20px;background:var(--bg2);border-radius:4px;overflow:hidden;position:relative}
.budget-bar .bb-fill{height:100%;border-radius:4px;transition:width .3s}
.budget-bar .bb-val{min-width:80px;font-weight:600}

/* ========== SYNC INDICATOR ========== */
.sync-dot{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text3);padding:3px 8px;border-radius:6px;background:var(--bg2)}
.sync-dot.connected{color:var(--green)}
.sync-dot .sd-icon{width:6px;height:6px;border-radius:50%;background:currentColor}
.sync-dot.syncing .sd-icon{animation:syncPulse 1s infinite}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.3}}
.offline-banner{position:fixed;top:0;left:0;right:0;padding:8px;background:#ff6b6b;color:#fff;text-align:center;font-size:12px;font-weight:600;z-index:999;transform:translateY(-100%);transition:transform .3s}
.offline-banner.show{transform:translateY(0)}

/* ========== COUNTDOWN ========== */
.countdown{display:flex;gap:8px;align-items:baseline}
.cd-num{font-size:28px;font-weight:800;color:var(--primary);line-height:1;letter-spacing:-.5px}
.cd-unit{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}

/* ========== LEAVE CALENDAR DOTS ========== */
.cal-day .d-leave{font-size:9px;color:var(--purple);font-weight:500;margin-bottom:1px}

/* ========== ATTACHMENT LINK ========== */
.attach-link{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:var(--primary-dim);border-radius:6px;font-size:11px;color:var(--primary);cursor:pointer;margin-top:4px}
.attach-link:hover{background:var(--primary-glow)}

/* ========== KEYBOARD SHORTCUT HINT ========== */
.kbd{display:inline-flex;padding:1px 5px;border:1px solid var(--glass-border);border-radius:4px;font-size:10px;font-family:'JetBrains Mono','SF Mono',Monaco,monospace;color:var(--text3);background:transparent}

/* ========== PH LEGEND ========== */
.ph-legend{display:flex;gap:16px;margin-top:16px;padding:12px 16px;background:var(--card);border:1px solid var(--glass-border);border-radius:8px;font-size:11px;flex-wrap:wrap}
.ph-legend-item{display:flex;align-items:center;gap:6px}
.ph-dot{width:8px;height:8px;border-radius:50%}
.ph-dot.sg{background:var(--sg)}.ph-dot.my{background:var(--my)}

/* ========== LEAVE APPLIED TABLE ========== */
.la-table{width:100%;font-size:12px;border-collapse:collapse}
.la-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);padding:8px 12px;border-bottom:1px solid var(--border);font-weight:600}
.la-table td{padding:8px 12px;border-bottom:1px solid var(--glass-border)}
.la-table tr:hover td{background:var(--card)}
.la-add-row{display:flex;gap:8px;padding:12px;align-items:flex-end;flex-wrap:wrap}

/* ========== TIME PERIOD FILTER ========== */
.tp-filter{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tp-sel{width:auto;min-width:120px;padding:6px 10px;font-size:12px;border-radius:6px;background:var(--input-bg);border:1px solid var(--border);color:var(--text);cursor:pointer}
.tp-date{width:auto;padding:5px 8px;font-size:11px;border-radius:6px;background:var(--input-bg);border:1px solid var(--border);color:var(--text)}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:flex}
  .main{margin-left:0}
  .page-header{padding-left:56px}
  .page-content{padding:14px}
  .fg{grid-template-columns:1fr}
  .trip-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .search-bar{max-width:100%}
  .fab{bottom:16px;right:16px}
  .tp-filter{flex-wrap:wrap}
  .tp-sel{min-width:100px;font-size:11px;padding:5px 6px}
  .tp-date{font-size:10px;padding:4px 6px;max-width:120px}
  .page-header{flex-wrap:wrap;gap:8px}
  .leave-boxes{grid-template-columns:repeat(2,1fr)}
  .la-table{font-size:11px}
  .la-table th,.la-table td{padding:6px 8px}
}

const TP_OPTIONS=[

function tpRange(tp){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  if(!tp||tp==='all')return{from:null,to:null};
  if(tp==='year')return{from:y+'-01-01',to:y+'-12-31'};
  if(tp==='quarter'){const q=Math.floor(m/3)*3;const qs=new Date(y,q,1),qe=new Date(y,q+3,0);return{from:qs.toISOString().slice(0,10),to:qe.toISOString().slice(0,10)};}
  if(tp==='3m'){const d=new Date(now);d.setMonth(d.getMonth()-3);return{from:d.toISOString().slice(0,10),to:now.toISOString().slice(0,10)};}
  if(tp==='6m'){const d=new Date(now);d.setMonth(d.getMonth()-6);return{from:d.toISOString().slice(0,10),to:now.toISOString().slice(0,10)};}
  if(tp==='custom')return{from:S._tpFrom||null,to:S._tpTo||null};
  return{from:null,to:null};
}
function tpFilter(trips){
  const r=tpRange(S._tp);
  if(!r.from&&!r.to)return trips;
  return trips.filter(t=>{
    if(r.from&&t.endDate<r.from)return false;
    if(r.to&&t.startDate>r.to)return false;
    return true;
  });
}

const GIST_FILE='holiday-tracker-data.json';
const GIST_DESC='Holiday Tracker Sync Data (do not delete)';
function getSyncConfig(){try{return JSON.parse(localStorage.getItem('htSync'))||{};}catch(e){return {};}}
function setSyncConfig(c){try{localStorage.setItem('htSync',JSON.stringify(c));}catch(e){}}

let _syncTimer=null;
function debouncedSync(){
  if(!getSyncConfig().token)return;
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(()=>pushToGist(),3000);
}

let _pollTimer=null;
function startSyncPolling(){
  if(_pollTimer)return;
  _pollTimer=setInterval(()=>{
    if(document.visibilityState==='visible'&&getSyncConfig().token){
      pullFromGist().then(pulled=>{if(pulled)render();});
    }
  },30000);
}
function stopSyncPolling(){clearInterval(_pollTimer);_pollTimer=null;}

async function gistAPI(path,opts={}){
  const c=getSyncConfig();if(!c.token)throw new Error('No token');
  const hdrs={'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github.v3+json',...(opts.headers||{})};
  if(opts.body)hdrs['Content-Type']='application/json';
  const r=await fetch('https://api.github.com'+path,{...opts,headers:hdrs});
  if(!r.ok){const t=await r.text().catch(()=>'');if(r.status===401){updateSyncStatus('⚠️ Token expired — update in Settings');stopSyncPolling();}throw new Error('GitHub API '+r.status+': '+(t||'unknown error'));}
  const txt=await r.text();
  if(!txt)return {};
  return JSON.parse(txt);
}

function syncData(){

}

async function findExistingGist(){
  const gists=await gistAPI('/gists?per_page=100');
  return gists.find(g=>g.files&&g.files[GIST_FILE]);
}

async function pushToGist(retried){
  const c=getSyncConfig();if(!c.token)return;
  document.querySelectorAll('.sync-dot').forEach(d=>d.classList.add('syncing'));
  const payload={description:GIST_DESC,files:{[GIST_FILE]:{content:JSON.stringify(syncData(),null,2)}}};
  try{
    if(c.gistId){
      await gistAPI('/gists/'+c.gistId,{method:'PATCH',body:JSON.stringify(payload)});
    }else{
      // Try to find existing gist first before creating new
      const existing=await findExistingGist();
      if(existing){
        c.gistId=existing.id;setSyncConfig(c);
        await gistAPI('/gists/'+c.gistId,{method:'PATCH',body:JSON.stringify(payload)});
      }else{
        const g=await gistAPI('/gists',{method:'POST',body:JSON.stringify({...payload,public:false})});
        c.gistId=g.id;setSyncConfig(c);
      }
    }
    c.lastPush=Date.now();setSyncConfig(c);
    updateSyncStatus('Synced just now');
  }catch(e){
    // 409 = conflict / stale gist ID — clear it and retry once
    if(!retried&&(e.message.includes('409')||e.message.includes('cannot be updated'))){
      console.warn('Gist conflict, clearing cached ID and retrying…');
      c.gistId=null;setSyncConfig(c);
      return pushToGist(true);
    }
    console.error('Push failed:',e);updateSyncStatus('Sync error: '+e.message);
  }finally{document.querySelectorAll('.sync-dot').forEach(d=>d.classList.remove('syncing'));}
}

async function pullFromGist(retried){
  const c=getSyncConfig();if(!c.token)return false;
  try{
    let gist;
    if(c.gistId){
      try{gist=await gistAPI('/gists/'+c.gistId);}
      catch(e2){
        if(!retried&&(e2.message.includes('404')||e2.message.includes('409'))){
          console.warn('Gist not found/conflict, re-searching…');
          c.gistId=null;setSyncConfig(c);return pullFromGist(true);
        }
        throw e2;
      }
    }
    else{const found=await findExistingGist();if(found){c.gistId=found.id;setSyncConfig(c);gist=await gistAPI('/gists/'+found.id);}else return false;}
    if(!gist||!gist.files||!gist.files[GIST_FILE])return false;
    const remote=JSON.parse(gist.files[GIST_FILE].content);
    if(remote.lastModified&&(!S.lastModified||remote.lastModified>S.lastModified)){
      S.trips=remote.trips||S.trips;
      S.leave=remote.leave||S.leave;
      S.rates=remote.rates||S.rates;
      S.ratesUpdated=remote.ratesUpdated||S.ratesUpdated;
      S.theme=remote.theme||S.theme;
      S.lastModified=remote.lastModified;
      try{localStorage.setItem('htV4',JSON.stringify(S));}catch(e){}
      applyTheme();render();
      updateSyncStatus('Pulled latest data');
      return true;
    }
    updateSyncStatus('Already up to date');
    return false;
  }catch(e){console.error('Pull failed:',e);updateSyncStatus('Sync error: '+e.message);return false;}
}

async function fullSync(retried){
  updateSyncStatus('Syncing…');
  document.querySelectorAll('.sync-dot').forEach(d=>d.classList.add('syncing'));
  const c=getSyncConfig();if(!c.token){updateSyncStatus('No token set');return;}
  try{
    let gist;
    if(c.gistId){
      try{gist=await gistAPI('/gists/'+c.gistId);}
      catch(e2){
        if(!retried&&(e2.message.includes('404')||e2.message.includes('409'))){
          console.warn('Gist stale, clearing and retrying…');
          c.gistId=null;setSyncConfig(c);return fullSync(true);
        }
        throw e2;
      }
    }
    else{const found=await findExistingGist();if(found){c.gistId=found.id;setSyncConfig(c);gist=await gistAPI('/gists/'+found.id);}}
    if(gist&&gist.files&&gist.files[GIST_FILE]){
      const remote=JSON.parse(gist.files[GIST_FILE].content);
      if(remote.lastModified&&remote.lastModified>S.lastModified){
        S.trips=remote.trips||S.trips;S.leave=remote.leave||S.leave;
        S.rates=remote.rates||S.rates;S.ratesUpdated=remote.ratesUpdated||S.ratesUpdated;
        S.theme=remote.theme||S.theme;S.lastModified=remote.lastModified;
        try{localStorage.setItem('htV4',JSON.stringify(S));}catch(e){}
        applyTheme();render();
        updateSyncStatus('Pulled newer data from cloud');toast('Synced from cloud');return;
      }
    }
    await pushToGist();toast('Synced to cloud');
  }catch(e){console.error('Sync failed:',e);updateSyncStatus('Error: '+e.message);}
  finally{document.querySelectorAll('.sync-dot').forEach(d=>d.classList.remove('syncing'));}
}

function updateSyncStatus(msg){
  const el=document.getElementById('sync-status');
  if(el)el.textContent=msg;
  try{const dots=document.querySelectorAll('.sync-dot');dots.forEach(d=>{const c=getSyncConfig();if(c.token)d.classList.add('connected');else d.classList.remove('connected');});}catch(e){}
}

async function connectSync(){
  const inp=document.getElementById('sync-token');
  const token=inp?inp.value.trim():'';
  if(!token){toast('Enter a token');return;}
  updateSyncStatus('Connecting…');
  const c={token};
  setSyncConfig(c);
  try{
    // Verify token works
    const user=await gistAPI('/user');
    updateSyncStatus('Connected as '+user.login+'. Checking for existing data…');
    // Check for existing gist
    const existing=await findExistingGist();
    if(existing){
      c.gistId=existing.id;setSyncConfig(c);
      const fullGist=await gistAPI('/gists/'+existing.id);
      const remote=JSON.parse(fullGist.files[GIST_FILE].content);
      // First-time connect: always pull from cloud (cloud is source of truth)
      S.trips=remote.trips||S.trips;S.leave=remote.leave||S.leave;
      S.rates=remote.rates||S.rates;S.ratesUpdated=remote.ratesUpdated||S.ratesUpdated;
      S.theme=remote.theme||S.theme;S.lastModified=remote.lastModified||Date.now();
      try{localStorage.setItem('htV4',JSON.stringify(S));}catch(e){}
      applyTheme();render();
      updateSyncStatus('Connected & synced (pulled '+remote.trips.length+' trips)');
      toast('Connected & synced from cloud');
    }else{
      await pushToGist();
      updateSyncStatus('Connected & initial sync done ('+S.trips.length+' trips)');
      toast('Connected & synced');
    }
    render();
  }catch(e){
    setSyncConfig({});
    updateSyncStatus('Failed: '+e.message);
    toast('Connection failed');
  }
}

function disconnectSync(){
  setSyncConfig({});
  updateSyncStatus('Disconnected');
  render();
  toast('Sync disconnected');
}

function sortEntries(arr,type){
  const k=sortKey,d=sortDir==='asc'?1:-1;
  return [...arr].sort((a,b)=>{
    if(k==='date'){
      const da=type==='flights'?(a.departureTime||''):type==='hotels'?(a.checkIn||''):(a.date||'');
      const db=type==='flights'?(b.departureTime||''):type==='hotels'?(b.checkIn||''):(b.date||'');
      return (da.localeCompare(db))*d;
    }
    if(k==='cost')return ((parseFloat(a.cost)||0)-(parseFloat(b.cost)||0))*d;
    if(k==='name'){
      const na=type==='flights'?((a.airline||'')+' '+(a.flightNumber||'')):type==='hotels'?(a.name||''):(a.name||'');
      const nb=type==='flights'?((b.airline||'')+' '+(b.flightNumber||'')):type==='hotels'?(b.name||''):(b.name||'');
      return na.localeCompare(nb)*d;
    }
    return 0;
  });
}

// ===== LIVE CURRENCY RATES =====
async function fetchLiveRates(){
  try{
    const res=await fetch('https://open.er-api.com/v6/latest/SGD');
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(data.result==='success'&&data.rates){
      // API returns how many X per 1 SGD. We store how many SGD per 1 X.
      // So rate = 1 / (data.rates[X])
      for(const c of CUR){
        if(c==='SGD')continue;
        if(data.rates[c])S.rates[c]=parseFloat((1/data.rates[c]).toFixed(6));
      }
      S.ratesUpdated=new Date().toISOString().slice(0,16).replace('T',' ');
      saveS();
      console.log('Live rates updated:', S.ratesUpdated);
    }
  }catch(e){console.warn('Currency fetch failed, using cached rates:',e.message);}
}
// Fetch on load (non-blocking)
fetchLiveRates();

function syncIndicatorHtml(){
  const c=getSyncConfig();
  if(!c.token)return '<div class="sync-dot"><div class="sd-icon"></div>Offline</div>';
  let timeAgo='';
  if(c.lastPush){
    const diff=Date.now()-c.lastPush;
    if(diff<60000)timeAgo='just now';
    else if(diff<3600000)timeAgo=Math.floor(diff/60000)+'m ago';
    else if(diff<86400000)timeAgo=Math.floor(diff/3600000)+'h ago';
    else timeAgo=Math.floor(diff/86400000)+'d ago';
  }
  return `<div class="sync-dot connected"><div class="sd-icon"></div>Synced${timeAgo?' · '+timeAgo:''}</div>`;
}

// ===== TIMELINE =====
function rTimeline(t){
  // Collect all entries with dates
  const items=[];
  (t.flights||[]).forEach(f=>{const d=f.departureTime?(f.departureTime.includes('T')?f.departureTime.split('T')[0]:f.departureTime.split(' ')[0]):'';items.push({type:'flight',date:d||t.startDate,time:f.departureTime,label:`${f.airline||''} ${f.flightNumber||''}`.trim()||'Flight',sub:`${f.from||'?'} → ${f.to||'?'}`,cost:f.cost?`${f.currency} ${parseFloat(f.cost).toLocaleString()}`:''});});
  (t.hotels||[]).forEach(h=>{items.push({type:'hotel',date:h.checkIn||t.startDate,time:'',label:h.name||'Hotel',sub:`${fmt(h.checkIn)} — ${fmt(h.checkOut)} (${nights(h.checkIn,h.checkOut)}n)`,cost:h.cost?`${h.currency} ${parseFloat(h.cost).toLocaleString()}`:''});});
  (t.activities||[]).forEach(a=>{items.push({type:'activity',date:a.date||t.startDate,time:a.time||'',label:a.name||'Activity',sub:a.location||'',cost:a.cost?`${a.currency} ${parseFloat(a.cost).toLocaleString()}`:''});});
  (t.transport||[]).forEach(x=>{items.push({type:'transport',date:x.date||t.startDate,time:x.time||'',label:`${x.type||''} ${x.name||''}`.trim()||'Transport',sub:x.location||'',cost:x.cost?`${x.currency} ${parseFloat(x.cost).toLocaleString()}`:''});});
  items.sort((a,b)=>(a.date+' '+(a.time||'99')).localeCompare(b.date+' '+(b.time||'99')));
  if(!items.length)return '<div class="empty"><p>No entries yet — add flights, hotels, or activities to see your itinerary</p></div>';
  let lastDate='';
  return `<h3 style="font-size:14px;margin-bottom:12px">Itinerary Timeline</h3><div class="timeline">${items.map(it=>{
    const showDate=it.date!==lastDate;lastDate=it.date;
    return `${showDate?`<div class="tl-date" style="margin-top:${showDate&&lastDate?'8':'0'}px">${fmt(it.date)} · ${dayN(it.date)}</div>`:''}<div class="tl-item tl-${it.type}"><div class="tl-content"><div style="display:flex;justify-content:space-between;align-items:center"><h4>${esc(it.label)}</h4>${it.cost?`<span style="font-size:11px;font-weight:600;color:var(--green)">${it.cost}</span>`:''}</div>${it.sub?`<div class="tl-sub">${esc(it.sub)}</div>`:''}</div></div>`;
  }).join('')}</div>`;
}

// ===== CALENDAR =====
function vCal(){
  const y=S.calY||2026,m=S.calM!=null?S.calM:new Date().getMonth();
  const mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const startDay=first.getDay()||7;// Mon=1
  const daysInMonth=last.getDate();
  const today=new Date().toISOString().slice(0,10);
  // Build leave days set using centralized PH data
  const leaveDays=new Set();
  S.trips.forEach(t=>{
    const ts=t.startDate,te=t.endDate;if(!ts||!te)return;
    let cur=new Date(ts+'T00:00:00');const end=new Date(te+'T00:00:00');
    while(cur<=end){
      const ds=cur.toISOString().slice(0,10);const dow=cur.getDay();
      if(dow!==0&&dow!==6&&!isSGPH(ds))leaveDays.add(ds);
      cur.setDate(cur.getDate()+1);
    }
  });
  // Build calendar grid
  let cells='';
  const prevLast=new Date(y,m,0).getDate();
  for(let i=startDay-2;i>=0;i--){
    const d=prevLast-i;
    cells+=`<div class="cal-day other"><div class="d-num">${d}</div></div>`;
  }
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===today;
    const dow=new Date(y,m,d).getDay();
    const isWknd=dow===0||dow===6;
    const phs=getPH(ds);
    const tripsOn=tpFilter(S.trips).filter(t=>t.startDate<=ds&&t.endDate>=ds);
    const isApplied=getAppliedForDate(ds,y);
    cells+=`<div class="cal-day${isToday?' today':''}" data-date="${ds}">
      <div class="d-num${isWknd?' weekend':''}">${d}</div>
      ${phs.map(ph=>`<div class="d-ph ph-${ph.country.toLowerCase()}" title="${esc(ph.n)}${ph.country==='MY'?' ('+fmtStates(ph.states)+')':''}">${esc(ph.n.length>14?ph.n.slice(0,12)+'…':ph.n)}</div>`).join('')}
      ${leaveDays.has(ds)&&!phs.some(p=>p.country==='SG')?`<div class="d-leave" style="font-size:8px;color:var(--purple);font-weight:500">${isApplied?'Applied':'Leave'}</div>`:''}
      ${tripsOn.slice(0,2).map(t=>`<div class="cal-trip" style="background:${tColor(t)}" data-action="view" data-id="${t.id}" title="${esc(t.name)}">${esc(t.name)}</div>`).join('')}
      ${tripsOn.length>2?`<div style="font-size:8px;color:var(--text3)">+${tripsOn.length-2}</div>`:''}
    </div>`;
  }
  const totalCells=(startDay-1)+daysInMonth;
  const remaining=(7-totalCells%7)%7;
  for(let i=1;i<=remaining;i++){
    cells+=`<div class="cal-day other"><div class="d-num">${i}</div></div>`;
  }
  // Collect PH in this month for legend
  const monthPHs=[];
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    getPH(ds).forEach(ph=>monthPHs.push({...ph,d:ds}));
  }
  return `
  <div class="page-header"><div><h2>Calendar</h2><div class="subtitle">${mn[m]} ${y}</div></div><div>${tpHtml()}</div></div>
  <div class="page-content">
    <div class="cal-nav">
      <button class="btn btn-s" data-action="cal-prev">← Prev</button>
      <h3>${mn[m]} ${y}</h3>
      <button class="btn btn-s" data-action="cal-next">Next →</button>
      <button class="btn btn-ghost" data-action="cal-today">Today</button>
    </div>
    <div class="cal-grid">
      <div class="cal-head">Mon</div><div class="cal-head">Tue</div><div class="cal-head">Wed</div><div class="cal-head">Thu</div><div class="cal-head">Fri</div><div class="cal-head">Sat</div><div class="cal-head">Sun</div>
      ${cells}
    </div>
    <div class="ph-legend">
      <div class="ph-legend-item"><div class="ph-dot sg"></div><span style="font-weight:600">SG</span> Singapore</div>
      <div class="ph-legend-item"><div class="ph-dot my"></div><span style="font-weight:600">MY</span> Malaysia</div>
    </div>
    ${monthPHs.length?`<div class="card" style="margin-top:12px"><div class="card-header"><h3>Public Holidays This Month</h3></div><div class="card-body" style="padding:8px 16px">${monthPHs.map(ph=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--glass-border);font-size:12px"><div style="display:flex;align-items:center;gap:8px"><span class="d-ph ph-${ph.country.toLowerCase()}" style="display:inline-block;margin:0">${ph.country}</span><span>${esc(ph.n)}</span></div><div style="display:flex;align-items:center;gap:8px"><span style="color:var(--text3);font-size:11px">${ph.country==='MY'?fmtStates(ph.states):''}</span><span style="color:var(--text3)">${fmt(ph.d)}</span></div></div>`).join('')}</div></div>`:''}
    <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">
      ${tpFilter(S.trips).filter(t=>{const ts=new Date(t.startDate),te=new Date(t.endDate);return(ts.getFullYear()===y&&ts.getMonth()===m)||(te.getFullYear()===y&&te.getMonth()===m)||(ts<=first&&te>=last);}).map(t=>`<div style="display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer" data-action="view" data-id="${t.id}"><div style="width:10px;height:10px;border-radius:3px;background:${tColor(t)}"></div>${esc(t.name)}</div>`).join('')}
    </div>
  </div>`;
}

// ===== LEAVE =====
// Calculate total workdays needed for all trips in a year (trip days - weekends - SG PH)
function calcLeaveDaysForYear(year,useFilter){
  const yStr=String(year);
  let count=0;
  (useFilter?tpFilter(S.trips):S.trips).forEach(t=>{
    if(!t.startDate||!t.endDate)return;
    let cur=new Date(t.startDate+'T00:00:00');const end=new Date(t.endDate+'T00:00:00');
    while(cur<=end){
      const ds=cur.toISOString().slice(0,10);const dow=cur.getDay();
      if(ds.startsWith(yStr)&&dow!==0&&dow!==6&&!isSGPH(ds))count++;
      cur.setDate(cur.getDate()+1);
    }
  });
  return count;
}
// Count applied leave days for a year
function calcAppliedDays(year){
  const l=S.leave[year];if(!l||!l.applied)return 0;
  let count=0;
  l.applied.forEach(a=>{
    if(!a.from||!a.to)return;
    let cur=new Date(a.from+'T00:00:00');const end=new Date(a.to+'T00:00:00');
    while(cur<=end){
      const dow=cur.getDay();
      if(dow!==0&&dow!==6)count+=a.half?0.5:1;
      cur.setDate(cur.getDate()+1);
    }
  });
  return count;
}
// Check if a specific date has applied leave
function getAppliedForDate(dateStr,year){
  const l=S.leave[year||parseInt(dateStr.slice(0,4))];if(!l||!l.applied)return false;
  return l.applied.some(a=>a.from<=dateStr&&a.to>=dateStr);
}
// Migrate flat leave data → jobs array
function migrateLeaveJobs(l){
  if(l.jobs)return l;
  const job={employer:l.employer||'',startDate:'',endDate:'',al:l.al||0,bp:l.bp||0,ot:l.ot||0,ph:l.ph||0,taken:l.taken||0};
  return{...l,jobs:[job],applied:l.applied||[]};
}
function leaveJobTotals(jobs){

// ===== CALENDAR EXPORT (.ics) =====
function icsDate(d){return d.replace(/[-:]/g,'').replace(/\.\d+/,'').slice(0,8);}
function icsDateTime(d){if(!d)return'';const s=d.replace(/[-:T ]/g,'').replace(/\.\d+/,'');return s.length>=12?s.slice(0,15)+'Z':s.slice(0,8)+'T000000Z';}
function icsUid(){return 'ht-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'@holiday-tracker';}
function icsEscape(s){return(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function generateICS(){
  const events=[];const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'').slice(0,15)+'Z';
  S.trips.forEach(t=>{
    // Trip event (all-day, start to end)
    events.push([
      'BEGIN:VEVENT','DTSTART;VALUE=DATE:'+icsDate(t.startDate),
      'DTEND;VALUE=DATE:'+icsDate(new Date(new Date(t.endDate+'T00:00:00').getTime()+86400000).toISOString()),
      'SUMMARY:'+icsEscape('🌍 '+t.name),
      'DESCRIPTION:'+icsEscape('Locations: '+(t.locations||[]).join(', ')+(t.notes?'\\n'+t.notes:'')),
      'UID:'+icsUid(),'DTSTAMP:'+now,'STATUS:CONFIRMED','TRANSP:OPAQUE',
      'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(t.name+' in 7 days'),'END:VALARM',
      'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(t.name+' tomorrow!'),'END:VALARM',
      'END:VEVENT'
    ].join('\r\n'));
    // Flight events
    (t.flights||[]).forEach(f=>{
      const dt=f.departureTime||t.startDate;const label=(f.airline?f.airline+' ':'')+(f.flightNumber||'');
      const summary='✈️ '+label+': '+f.from+' → '+f.to;
      const startD=dt.length>10?icsDateTime(dt):(icsDate(dt));
      const isAllDay=dt.length<=10;
      events.push([
        'BEGIN:VEVENT',
        isAllDay?'DTSTART;VALUE=DATE:'+startD:'DTSTART:'+startD,
        isAllDay?'DTEND;VALUE=DATE:'+startD:'DTEND:'+(f.arrivalTime?icsDateTime(f.arrivalTime):startD),
        'SUMMARY:'+icsEscape(summary),
        'DESCRIPTION:'+icsEscape('Trip: '+t.name+(f.pnr?'\\nPNR: '+f.pnr:'')+(f.seat?'\\nSeat: '+f.seat:'')+(f.notes?'\\n'+f.notes:'')),
        'UID:'+icsUid(),'DTSTAMP:'+now,'STATUS:CONFIRMED',
        'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(summary+' in 7 days'),'END:VALARM',
        'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(summary+' tomorrow!'),'END:VALARM',
        'END:VEVENT'
      ].join('\r\n'));
    });
    // Hotel events
    (t.hotels||[]).forEach(h=>{
      if(!h.checkIn)return;
      events.push([
        'BEGIN:VEVENT','DTSTART;VALUE=DATE:'+icsDate(h.checkIn),
        'DTEND;VALUE=DATE:'+icsDate(h.checkOut||h.checkIn),
        'SUMMARY:'+icsEscape('🏨 '+h.name),
        'DESCRIPTION:'+icsEscape('Trip: '+t.name+(h.notes?'\\n'+h.notes:'')),
        'LOCATION:'+icsEscape(h.name||''),
        'UID:'+icsUid(),'DTSTAMP:'+now,'STATUS:CONFIRMED',
        'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(h.name+' check-in in 7 days'),'END:VALARM',
        'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(h.name+' check-in tomorrow!'),'END:VALARM',
        'END:VEVENT'
      ].join('\r\n'));
    });
    // Activity events
    (t.activities||[]).forEach(a=>{
      if(!a.date)return;
      events.push([
        'BEGIN:VEVENT','DTSTART;VALUE=DATE:'+icsDate(a.date),
        'DTEND;VALUE=DATE:'+icsDate(a.date),
        'SUMMARY:'+icsEscape('🎯 '+(a.name||'Activity')),
        'DESCRIPTION:'+icsEscape('Trip: '+t.name+(a.notes?'\\n'+a.notes:'')),
        'LOCATION:'+icsEscape(a.location||''),
        'UID:'+icsUid(),'DTSTAMP:'+now,'STATUS:CONFIRMED',
        'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:'+icsEscape((a.name||'Activity')+' in 7 days'),'END:VALARM',
        'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+icsEscape((a.name||'Activity')+' tomorrow!'),'END:VALARM',
        'END:VEVENT'
      ].join('\r\n'));
    });
  });
  const cal=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Holiday Tracker//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'X-WR-CALNAME:Holiday Tracker','X-WR-TIMEZONE:Asia/Singapore',...events,'END:VCALENDAR'].join('\r\n');
  const blob=new Blob([cal],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='holiday-tracker-events.ics';a.click();
  toast('Calendar exported — import into Outlook for reminders');
}

  S.trips=S.trips.filter(t=>t.endDate>=today);

  S.trips=origTrips;
}

function modal(title,body,onSave){

function xm(){document.getElementById('mbg').classList.remove('open');}

function tripCur(trip){
  if(!trip)return 'SGD';
  const all=[...(trip.flights||[]),...(trip.hotels||[]),...(trip.activities||[]),...(trip.transport||[])];
  for(let i=all.length-1;i>=0;i--){if(all[i].currency)return all[i].currency;}
  return 'SGD';
}
function curSel(sel='SGD',nm='currency'){return`<select class="fc" name="${nm}">${CUR.map(c=>`<option value="${c}"${c===sel?' selected':''}>${c}</option>`).join('')}</select>`;}
function dzHtml(id){return`<div class="fi full"><label>Upload PDF / Image (OCR)</label><div class="dz" data-dz="${id}"><div class="dz-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><p>Drop PDF or image here</p><p class="sm">Supports PDF, PNG, JPG</p><input type="file" accept=".pdf,.png,.jpg,.jpeg" style="display:none" data-fi="${id}"></div><div class="ocr-prog" id="op-${id}" style="display:none"></div><div class="ocr-out" id="or-${id}" style="display:none"></div></div>`;}

function setupDZ(dz){
  const id=dz.dataset.dz,inp=dz.querySelector(`[data-fi="${id}"]`);
  dz.onclick=()=>inp.click();
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
  dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files.length)runOCR(e.dataTransfer.files[0],id);};
  inp.onchange=e=>{if(e.target.files.length)runOCR(e.target.files[0],id);};
}

async function runOCR(file,id){
  const p=document.getElementById('op-'+id),r=document.getElementById('or-'+id);
  p.style.display='flex';p.innerHTML='<div class="spinner"></div> Processing…';r.style.display='none';
  try{
    let txt='';
    if(file.type==='application/pdf'){
      // Try PDF.js text extraction first (much more accurate than OCR)
      p.innerHTML='<div class="spinner"></div> Extracting text from PDF…';
      if(typeof pdfjsLib==='undefined'){initPdfJs();await new Promise(r2=>setTimeout(r2,1000));}
      if(typeof pdfjsLib!=='undefined'){
        const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
        for(let i=1;i<=Math.min(pdf.numPages,10);i++){
          p.innerHTML=`<div class="spinner"></div> Reading page ${i}/${pdf.numPages}…`;
          const pg=await pdf.getPage(i);
          const tc=await pg.getTextContent();
          const pageTxt=tc.items.map(it=>it.str).join(' ');
          txt+=pageTxt+'\n\n';
        }
        // If text extraction got very little, fall back to OCR
        if(txt.replace(/\s/g,'').length<30){
          txt='';
          p.innerHTML='<div class="spinner"></div> Text extraction sparse, trying OCR…';
          for(let i=1;i<=Math.min(pdf.numPages,10);i++){
            p.innerHTML=`<div class="spinner"></div> OCR page ${i}/${pdf.numPages}…`;
            const pg=await pdf.getPage(i),vp=pg.getViewport({scale:2.5}),cv=document.createElement('canvas');
            cv.width=vp.width;cv.height=vp.height;
            await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
            if(typeof Tesseract!=='undefined'){const r2=await Tesseract.recognize(cv,'eng',{tessedit_pageseg_mode:'6'});txt+=r2.data.text+'\n\n';}
          }
        }
      }else{txt='PDF.js not loaded. Try again in a moment.';}
    }else if(file.type.startsWith('image/')){
      p.innerHTML='<div class="spinner"></div> Running OCR on image…';
      if(typeof Tesseract!=='undefined'){
        // Use higher quality settings for screenshots
        const r2=await Tesseract.recognize(file,'eng',{tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
        txt=r2.data.text;
      }else{txt='Tesseract not loaded yet. Try again in a moment.';}
    }else{txt='Unsupported file type: '+file.type;}
    r.textContent=txt.trim()||'No text detected.';r.style.display='block';
    p.innerHTML='✓ Done — '+file.name;
    // Auto-fill form fields if inside a modal
    if(txt.trim())autoFillForm(txt.trim(),id);
  }catch(e){p.innerHTML='Error: '+e.message;console.error('OCR error:',e);r.style.display='none';}
}

function autoFillForm(txt,dzId){
  const m=document.querySelector('.modal');if(!m)return;
  const parsed=parseBookingText(txt);if(!parsed)return;
  const s=(n,v)=>{const el=m.querySelector(`[name="${n}"]`);if(el&&!el.value&&v)el.value=v;};
  // Detect form type by checking which fields exist
  if(m.querySelector('[name="airline"]')){
    // Flight form
    s('airline',parsed.airline);s('fn',parsed.flightNumber);s('pnr',parsed.pnr);
    s('seat',parsed.seat);s('from',parsed.from);s('to',parsed.to);
    if(parsed.date)s('dep',(parsed.date+'T'+(parsed.departureTime||'00:00')));
    if(parsed.dateTo||parsed.date)s('arr',((parsed.dateTo||parsed.date)+'T'+(parsed.arrivalTime||'00:00')));
    s('duration',parsed.duration||'');
    s('cost',parsed.cost);
    if(parsed.currency){const cEl=m.querySelector('[name="currency"]');if(cEl)cEl.value=parsed.currency;}
    // Auto-calc duration if dep & arr filled
    setTimeout(()=>{const dep=m.querySelector('[name="dep"]'),arr=m.querySelector('[name="arr"]'),dur=m.querySelector('[name="duration"]');if(dep&&arr&&dur&&dep.value&&arr.value&&!dur.value){const ms=new Date(arr.value)-new Date(dep.value);if(ms>0){const h=Math.floor(ms/3600000),mn=Math.round((ms%3600000)/60000);dur.value=h+'h '+(mn<10?'0':'')+mn+'m';}}},100);
  }else if(m.querySelector('[name="ci"]')){
    // Hotel form
    s('name',parsed.hotelName||parsed.name);s('bn',parsed.bookingNumber||parsed.pnr);
    s('ci',parsed.date);s('co',parsed.dateTo);s('cost',parsed.cost);
    if(parsed.roomType||parsed.nights){const notesParts=[];if(parsed.roomType)notesParts.push(parsed.roomType);if(parsed.nights)notesParts.push(parsed.nights+' nights');s('notes',notesParts.join(' · '));}
    if(parsed.currency){const cEl=m.querySelector('[name="currency"]');if(cEl)cEl.value=parsed.currency;}
    // Auto-calc nights after fill
    setTimeout(()=>{const ci=m.querySelector('[name="ci"]'),co=m.querySelector('[name="co"]'),ni=m.querySelector('[name="nights"]');if(ci&&co&&ni&&ci.value&&co.value&&!ni.value){const n=calcNights(ci.value,co.value);if(n)ni.value=n;}},100);
  }else if(m.querySelector('[name="loc"]')&&!m.querySelector('[name="type"]')){
    // Activity form
    s('name',parsed.name);s('loc',parsed.locations?parsed.locations[0]:'');
    s('date',parsed.date);s('cost',parsed.cost);s('bd',parsed.pnr||parsed.bookingNumber);
    if(parsed.currency){const cEl=m.querySelector('[name="currency"]');if(cEl)cEl.value=parsed.currency;}
  }else if(m.querySelector('[name="type"]')){
    // Transport form
    s('name',parsed.name);s('loc',parsed.locations?parsed.locations[0]:'');
    s('date',parsed.date);s('cost',parsed.cost);s('bd',parsed.pnr||parsed.bookingNumber);
    if(parsed.currency){const cEl=m.querySelector('[name="currency"]');if(cEl)cEl.value=parsed.currency;}
  }
  toast('Auto-filled from scan');
}

      // Auto-match trip (allow ±3 day buffer around trip dates for positioning flights)
      const tripSel=document.getElementById('su-trip');
      if(parsed.date){
        const pd=new Date(parsed.date+'T00:00:00').getTime();
        let bestMatch=null,bestDist=Infinity;

          const ts=new Date(tr.startDate+'T00:00:00').getTime(),te=new Date(tr.endDate+'T00:00:00').getTime();
          const buf=3*864e5;// 3 day buffer
          if(pd>=(ts-buf)&&pd<=(te+buf)){
            const dist=Math.min(Math.abs(pd-ts),Math.abs(pd-te));
            if(dist<bestDist){bestDist=dist;bestMatch=tr;}
          }
        }
        // Also check locations overlap
        if(!bestMatch&&parsed.locations&&parsed.locations.length){
          bestMatch=S.trips.find(tr=>tr.locations.some(l=>parsed.locations.some(pl=>l.toUpperCase().includes(pl.toUpperCase())||pl.toUpperCase().includes(l.toUpperCase()))));

      let parsedHtml='<h4>Extracted Data</h4>';
      if(parsed.multiLeg&&parsed.legs){
        parsedHtml+=`<div class="su-field"><span class="k">Type</span><span class="v">Multi-segment flight (${parsed.legs.length} legs)</span></div>`;
        parsedHtml+=`<div class="su-field"><span class="k">PNR</span><span class="v">${esc(parsed.pnr||'')}</span></div>`;

        parsedHtml+=`<div class="su-field"><span class="k">Dates</span><span class="v">${esc(parsed.date||'')} → ${esc(parsed.dateTo||parsed.date||'')}</span></div>`;
        parsed.legs.forEach((leg,i)=>{
          parsedHtml+=`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><span style="font-weight:600;font-size:11px;color:var(--primary)">Leg ${i+1}: ${esc(leg.flightNumber||'')}</span></div>`;
          parsedHtml+=`<div class="su-field"><span class="k">Route</span><span class="v">${esc(leg.from||'?')} → ${esc(leg.to||'?')}</span></div>`;
          if(leg.date)parsedHtml+=`<div class="su-field"><span class="k">Date</span><span class="v">${esc(leg.date)}</span></div>`;
          if(leg.departureTime)parsedHtml+=`<div class="su-field"><span class="k">Depart</span><span class="v">${esc(leg.departureTime)}</span></div>`;
          if(leg.arrivalTime)parsedHtml+=`<div class="su-field"><span class="k">Arrive</span><span class="v">${esc(leg.arrivalTime)}</span></div>`;
          if(leg.seat)parsedHtml+=`<div class="su-field"><span class="k">Seat</span><span class="v">${esc(leg.seat)}</span></div>`;
          if(leg.duration)parsedHtml+=`<div class="su-field"><span class="k">Duration</span><span class="v">${esc(leg.duration)}</span></div>`;
        });
      }else{
        parsedHtml+=Object.entries(parsed).filter(([k,v])=>v&&k!=='rawText'&&k!=='type'&&k!=='multiLeg'&&k!=='legs').map(([k,v])=>`<div class="su-field"><span class="k">${k}</span><span class="v">${esc(Array.isArray(v)?v.join(', '):String(v))}</span></div>`).join('');
      }
      document.getElementById('su-parsed').innerHTML=parsedHtml;
    }
  };
  dz.onclick=()=>inp.click();
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files.length)hookOCR(e.dataTransfer.files[0]);};
  inp.onchange=e=>{if(e.target.files.length)hookOCR(e.target.files[0]);};
}
